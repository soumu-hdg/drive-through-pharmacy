<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a4d12">
<title>DigiMaster Mobile</title>
<style>
  :root { --g: #0a4d12; --g2: #146b28; --line: #cbd9d5; --bg: #f4f6f5; --ink: #111827; --muted: #5e6b67; --amber: #b45309; --red: #b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans JP', -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font-family: inherit; font-size: 16px; }
  .hdr { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px; background: linear-gradient(180deg, var(--g2), var(--g)); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .hdr b { font-size: 16px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .ib { width: 40px; height: 40px; border: none; background: rgba(255,255,255,.14); color: #fff; border-radius: 6px; font-size: 18px; }
  .hdr .back { width: auto; padding: 0 12px; font-size: 14px; }
  .wrap { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .field { display: block; margin: 10px 0; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--g); color: #fff; font-weight: 700; font-size: 16px; }
  .btn:disabled { opacity: .5; }
  .btn.sec { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; }
  .clinic-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .clinic-picker .clinic-pick { padding: 12px 4px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; font-size: 14px; }
  .clinic-picker .clinic-pick.on { background: var(--g); color: #fff; border-color: var(--g); font-weight: 700; }
  /* 一覧 */
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; font-size: 14px; color: var(--muted); }
  .bar b { color: var(--ink); font-size: 16px; }
  .bar .sp { flex: 1; }
  .plist { list-style: none; margin: 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .plist .t { width: 52px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; flex-shrink: 0; }
  .plist .nm { flex: 1; min-width: 0; }
  .plist .nm .k { display: block; font-size: 12px; color: var(--muted); }
  .plist .nm .n { display: block; font-size: 18px; font-weight: 700; }
  .plist .nm .n.f { color: #c14a7a; } .plist .nm .n.m { color: #0964a5; }
  .plist .ag { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .st { display: inline-block; padding: 3px 8px; border-radius: 4px; color: #fff; font-size: 12px; white-space: nowrap; }
  .st.reserved { background: #488e50; } .st.waiting { background: #d7708b; } .st.active { background: #1bacac; } .st.done { background: #839590; } .st.billing { background: #d01111; } .st.other { background: #6b7683; }
  .cnt { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--amber); color: #fff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .cnt.done { background: var(--g); }
  .empty { padding: 40px 10px; text-align: center; color: var(--muted); }
  /* 報告 */
  .phead { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .phead .n { font-size: 20px; font-weight: 700; } .phead .s { font-size: 13px; color: var(--muted); }
  .sec { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--g); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .sec h3 { margin: 0 0 2px; font-size: 16px; } .sec .hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .sec .cam { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sec .cam label { flex: 1 1 40%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px; border: 1px dashed var(--g); border-radius: 8px; color: var(--g); font-weight: 700; background: #f3f8f4; font-size: 13px; white-space: nowrap; }
  .sec .cam label.lib { border-style: solid; background: #fff; }
  .sec .cam input { display: none; }
  .sec .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: none; }
  .sec textarea { width: 100%; min-height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; }
  .sec .send { padding: 12px; }
  .sec .status { font-size: 13px; margin-top: 6px; min-height: 18px; }
  .sec .status.ok { color: var(--g); font-weight: 700; } .sec .status.ng { color: var(--red); }
  .sent { margin-top: 4px; }
  .sent .r { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .sent .r .kind { font-weight: 700; min-width: 64px; }
  .sent .r .memo { flex: 1; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .sent .r .stt { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #fdf3e2; color: var(--amber); white-space: nowrap; }
  .sent .r .stt.applied { background: #e3f2ec; color: #0e7a5f; } .sent .r .stt.dismissed { background: #eee; color: #666; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #242927; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js?v=20260820_v32"></script>
<script src="clinic_context.js?v=20260916_v22a"></script>
</head>
<body>

<!-- ログイン -->
<div id="mLogin" style="display:none">
  <div class="hdr"><b>DigiMaster Mobile</b></div>
  <div class="wrap">
    <div class="card">
      <h2>ログイン</h2>
      <p class="muted">PC のカルテと同じ職員 ID でログインします。診察中の医療補助が、保険証・医療証の提示、処方した薬、検査結果を PC に送るための画面です。</p>
      <label class="field"><span>接続クリニック</span><div id="mClinicPicker" class="clinic-picker"></div></label>
      <label class="field"><span>メールアドレス</span><input type="email" id="mEmail" autocomplete="username" inputmode="email"></label>
      <label class="field"><span>パスワード</span><input type="password" id="mPassword" autocomplete="current-password"></label>
      <button class="btn" id="mLoginBtn" onclick="Mobile.login()">ログイン</button>
      <div class="err" id="mLoginErr"></div>
    </div>
  </div>
</div>

<!-- 当日の患者一覧 -->
<div id="mList" style="display:none">
  <div class="hdr"><b id="mClinicName">受付</b><button class="ib" onclick="Mobile.loadList()" title="更新">⟳</button><button class="ib" onclick="Mobile.logout()" title="ログアウト">⏻</button></div>
  <div class="wrap">
    <div class="bar"><b id="mDate"></b><span class="sp"></span><span id="mCount"></span></div>
    <ul class="plist" id="mPatients"></ul>
    <p class="muted" style="font-size:12px">一覧は当日の予約・受付（PC と同じ元データ）。患者を選ぶと報告の画面が開きます。</p>
  </div>
</div>

<!-- 報告 -->
<div id="mReport" style="display:none">
  <div class="hdr"><button class="ib back" onclick="Mobile.backToList()">← 一覧</button><b id="mReportTitle">報告</b></div>
  <div class="wrap">
    <div class="phead"><div class="n" id="mPName"></div><div class="s" id="mPSub"></div></div>
    <div id="mSections"></div>
    <div class="card sent"><h2>この患者の送信済み</h2><div id="mSent"><div class="muted">まだありません</div></div></div>
  </div>
</div>

<div class="toast" id="mToast"></div>
<script src="mobile.js?v=20260919_a"></script>
</body>
</html>
