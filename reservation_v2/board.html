<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受付ライブボード｜予約統括システム</title>
<link rel="stylesheet" href="style.css">
<style>
  .admin-view{ display:none; }
  .admin-view.active{ display:block; }
  .placeholder-box{ text-align:center; padding:48px 20px; color:var(--sub); }
  .placeholder-box .pi{ font-size:15px; font-weight:700; color:var(--dark); margin-bottom:8px; }
  .placeholder-box .avail{ margin-top:16px; font-size:13px; }
  .avail-list{ display:inline-flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .avail-list a{ font-size:12.5px; color:var(--blue); text-decoration:none; border:1px solid var(--border); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .avail-list a:hover{ background:var(--blue-light); }
  .nf-times{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .slot-grid-day{ margin-bottom:14px; }
  .slot-grid-day .d{ font-weight:700; margin-bottom:6px; }
  .slot-cap{ display:inline-flex; flex-direction:column; align-items:center; min-width:66px; border:1px solid var(--border); border-radius:8px; padding:6px 4px; font-size:13px; }
  .slot-cap.full{ background:#f3f4f6; color:#9ca3af; }
  .slot-cap .rem{ font-size:11px; color:var(--sub); }
  /* クリニック切替（受付側・暗色ヘッダー内） */
  .clinic-switch{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:9px; }
  .clinic-switch .cs-label{ font-size:12px; color:#94a3b8; margin-right:2px; }
  .clinic-pill{ font:inherit; font-size:13px; color:#e2e8f0; background:#334155; border:1px solid #475569; border-radius:999px; padding:5px 15px; cursor:pointer; }
  .clinic-pill:hover{ background:#3f4d63; color:#fff; }
  .clinic-pill.active{ background:#fff; color:var(--dark); font-weight:700; border-color:#fff; }
  .clinic-pill small{ font-size:10px; opacity:.7; margin-left:4px; font-weight:400; }
  /* 診察室バッジ */
  .room-badge{ display:inline-block; font-size:11.5px; font-weight:700; color:#0e7490; background:#cffafe; border:1px solid #a5f3fc; border-radius:6px; padding:1px 8px; white-space:nowrap; }
  .room-badge.r2{ color:#7c3aed; background:#ede9fe; border-color:#ddd6fe; }
  /* 診察室 切替プルダウン */
  .room-sel{ font:inherit; font-size:12.5px; font-weight:700; color:#0e7490; background:#ecfeff; border:1px solid #a5f3fc; border-radius:7px; padding:4px 6px; cursor:pointer; }
  .room-sel.r2{ color:#7c3aed; background:#f5f3ff; border-color:#ddd6fe; }
  .room-sel:focus{ outline:2px solid var(--blue-light); }
  /* タイムライン（時間軸×診察室） */
  .tl-toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .tl-toolbar .day{ font-weight:700; font-size:15px; }
  .tl-wrap{ border:1px solid var(--dark); background:#fff; overflow-x:auto; }
  .tl-grid{ display:grid; grid-template-columns:56px repeat(var(--cols,2), minmax(150px,1fr)); }
  .tl-head-cell{ position:sticky; top:0; background:#eef2f7; border-bottom:1px solid var(--dark); border-right:1px solid var(--border); padding:8px 6px; font-size:12.5px; font-weight:700; text-align:center; z-index:2; }
  .tl-head-cell:last-child{ border-right:none; }
  .tl-axis{ border-right:1px solid var(--border); }
  .tl-axis .hr{ height:60px; border-bottom:1px solid var(--border); font-size:11px; color:var(--sub); padding:2px 6px; box-sizing:border-box; font-variant-numeric:tabular-nums; }
  .tl-col{ position:relative; border-right:1px solid var(--border); }
  .tl-col:last-child{ border-right:none; }
  .tl-col .hr{ height:60px; border-bottom:1px dashed var(--border); box-sizing:border-box; position:relative; }
  /* 30分の副目盛り（UI調査 B-6）。1時間の実線＋30分の点線で目測をなくす */
  .tl-col .hr::after{ content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dotted #e3e9f0; }
  /* 診療時間外（昼休み・時間外）はグレーで沈める（UI調査 B-6） */
  .tl-col .hr.closed, .tl-axis .hr.closed{ background:#f1f4f7; }
  .tl-col .hr.closed::after{ border-top-color:#e6ebf1; }
  /* --- 予約ブロック（UI調査 B-3 / E-5）------------------------------------
     色に意味を持たせる：左端の色＝診療区分／来院済＝薄い塗り／未割当＝破線／
     非患者ブロック（休憩・機材メンテ）＝無彩色のハッチ。
     以前は「列の偶数・奇数」で teal/purple に塗り分けていたが、列＝部屋は位置で自明なので
     色が情報を持っていなかった。 */
  .tl-blk{ position:absolute; left:3px; right:3px; padding:3px 7px; overflow:hidden; box-sizing:border-box;
           background:#fff; color:#1f2933; border:1px solid #c9d3de; border-left:4px solid var(--svc-c,#2160c4);
           border-radius:3px; box-shadow:0 1px 2px rgba(16,24,40,.10); font-variant-numeric:tabular-nums; }
  .tl-blk .w{ font-weight:700; font-size:11.5px; line-height:1.25; color:#101828; }
  .tl-blk .m{ font-size:10.5px; line-height:1.25; color:#5d6b7a; }
  .tl-blk:hover{ box-shadow:0 2px 6px rgba(16,24,40,.18); }
  .tl-blk.svc-gairai { --svc-c:#2160c4; }   /* 外来=青 */
  .tl-blk.svc-zaitaku{ --svc-c:#0e7a5f; }   /* 在宅=青緑 */
  .tl-blk.svc-biyou  { --svc-c:#a13a70; }   /* 美容=赤紫 */
  .tl-blk.svc-yakan  { --svc-c:#5b4bb5; }   /* 夜間休日=青紫 */
  .tl-blk.visited{ background:#e3f2ec; }                                   /* 来院済＝薄い緑の塗り */
  .tl-blk.cancelled{ background:#f1f3f6; color:#6b7280; }
  .tl-blk.cancelled .w{ text-decoration:line-through; color:#6b7280; }
  .tl-blk.un{ background:#fffbeb; border:1px dashed #d99a24; border-left:4px solid #d99a24; }  /* 未割当＝破線 */
  /* 非患者ブロック：無彩色＋斜線ハッチ。患者予約と一目で違って見える */
  .tl-blk.blk{ cursor:pointer; color:#3d4753; border:1px solid #9aa5b1; border-left:4px solid #6b7683;
    background:repeating-linear-gradient(135deg,#eceff3 0 6px,#dde2e8 6px 12px); box-shadow:none; }
  .tl-blk.blk .w{ color:#2f3742; font-weight:700; }
  .tl-blk.blk .m{ color:#5d6b7a; }
  .tl-now{ position:absolute; height:2px; background:var(--red); z-index:3; }
  .tl-now .now-label{ position:absolute; left:-52px; top:-9px; background:var(--red); color:#fff;
    font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:3px; font-variant-numeric:tabular-nums; }
  .tl-now::before{ content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--red); }
  .tl-axis-tabs{ display:inline-flex; gap:4px; }
  .tl-axis-btn{ font:inherit; font-size:13px; font-weight:700; padding:6px 14px; border:1px solid var(--border); background:#fff; color:var(--sub); border-radius:7px; cursor:pointer; }
  .tl-axis-btn.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
  /* 未割当（仮想列）：担当/機材が未設定の予約の置き場。見落とし防止のため琥珀色で目立たせる */
  .tl-head-cell.unassigned{ background:#fef3c7; color:#92580b; border-right:2px solid #f59e0b; }
  .tl-head-cell .u-count{ display:block; font-size:10.5px; font-weight:700; color:#b45309; margin-top:2px; }
  .tl-col.unassigned{ background:#fffbeb; border-right:2px solid #f59e0b; }
  .tl-blk.un{ background:#b45309; }
  .tl-axis-btn .u-badge{ display:inline-block; min-width:16px; margin-left:6px; padding:0 5px; border-radius:4px; background:#f59e0b; color:#fff; font-size:11px; font-weight:700; }
  .tl-axis-btn.on .u-badge{ background:#fff; color:#b45309; }
  .tl-compact{ font-size:12.5px; color:var(--dark); display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
  /* 連絡事項 */
  .day-note{ background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  .day-note .dn-label{ font-size:12.5px; font-weight:700; color:#92580b; display:block; margin-bottom:6px; }
  .day-note textarea{ width:100%; min-height:44px; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font:inherit; font-size:14px; resize:vertical; background:#fff; }
  .day-note #dnStatus{ font-size:12px; color:var(--green); margin-left:6px; }
  /* --- 危険操作の整理（UI調査 B-1 / B-2 / E-7）------------------------------
     行内の「取消」は白地＋赤枠のゴースト。赤の塗りは hover のときだけ。
     赤ボタンが10個並ぶと、本当に危険な操作が埋没して誤クリックを誘発するため。 */
  .admin-view button.small.danger{ background:#fff; color:var(--red,#c0392f); border:1px solid #e6c2be; font-weight:500; }
  .admin-view button.small.danger:hover{ background:var(--red-light,#faeae8); border-color:var(--red,#c0392f); }
  /* デモ初期化（全データ破壊系）は目立たせない。日別ボードの最上段からリソース設定タブの最下部へ移した */
  .danger-zone{ margin-top:22px; border-top:1px solid var(--border,#d5dbe3); padding-top:14px; }
  .danger-zone .dz-note{ font-size:12.5px; color:var(--sub,#5d6b7a); margin-bottom:8px; }
  button.quiet{ background:#f4f6f8; color:#5d6b7a; border:1px solid var(--border,#d5dbe3); font-weight:500;
    font-size:12.5px; padding:6px 12px; border-radius:6px; cursor:pointer; }
  button.quiet:hover{ background:#eceff3; color:#1f2933; }
  /* --- 数字の桁揃え（UI調査 B-12） --- */
  table, .tl-axis, .tl-blk, .stat .num, .slot-matrix, .t-num{ font-variant-numeric:tabular-nums; }
  /* --- 成功はトースト・失敗はバナー（UI調査 B-9 / E-7）--- */
  .toast-wrap{ position:fixed; right:18px; bottom:18px; z-index:300; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:#23303f; color:#fff; border-radius:6px; padding:11px 16px; font-size:13.5px;
    box-shadow:0 6px 20px rgba(16,24,40,.35); display:flex; gap:14px; align-items:center; }
  .fail-bar{ margin:0 0 14px; padding:11px 16px; border:1px solid #e6c2be; border-left:5px solid var(--red,#c0392f);
    background:#faeae8; color:#7f1d1d; font-size:14px; font-weight:700; display:flex; gap:12px; align-items:flex-start; }
  .fail-bar button{ margin-left:auto; background:none; border:none; color:#7f1d1d; font-size:18px; cursor:pointer; line-height:1; padding:0 2px; }
  /* 取消は打消し線で（色だけに頼らない・UI調査 B-3 / B-17） */
  .badge.cancelled{ text-decoration:line-through; }
  .pt-link.struck{ text-decoration:line-through; }
  /* --- 予約一覧の検索（UI調査 B-4 / E-8） --- */
  .list-search{ width:300px; padding:8px 12px; border:1px solid var(--border,#d5dbe3); border-radius:6px; font:inherit; font-size:13.5px; }
  .list-search:focus{ outline:2px solid var(--blue-light,#e7eff9); border-color:var(--blue,#2160c4); }
  .list-tools{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .list-tools .hint{ font-size:12px; color:var(--sub,#5d6b7a); }
  /* --- 予約枠の確認：時刻×日のマトリクス（UI調査 B-5 / E-4） --- */
  .slot-matrix{ border-collapse:collapse; font-size:12.5px; }
  .slot-matrix th, .slot-matrix td{ border:1px solid var(--border,#d5dbe3); padding:4px 8px; text-align:center; white-space:nowrap; }
  .slot-matrix th{ background:#f7f9fb; font-size:12px; color:var(--sub,#5d6b7a); font-weight:700; }
  .slot-matrix td.s-ok{ background:#eaf3ee; color:#0e7a5f; font-weight:700; }
  .slot-matrix td.s-few{ background:#fbf1dd; color:#a96a10; font-weight:700; }
  .slot-matrix td.s-full{ background:#f1f3f6; color:#98a2b3; }
  .slot-matrix td.s-closed{ background:#eceff3; color:#98a2b3; }
  .slot-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sub,#5d6b7a); margin:10px 0 4px; }
  .slot-legend i{ display:inline-block; width:12px; height:12px; border:1px solid var(--border,#d5dbe3); margin-right:4px; vertical-align:-2px; }
  /* --- 診療時間・休診日 --- */
  .hours-card{ background:#fff; border:1px solid var(--border,#d5dbe3); border-radius:10px; padding:16px; margin-bottom:16px; }
  .hours-card h3{ margin:0 0 4px; font-size:15px; }
  .src-tag{ display:inline-block; font-size:11.5px; font-weight:700; border-radius:3px; padding:1px 8px; margin-left:8px; border:1px solid transparent; }
  .src-tag.db{ background:#e7eff9; color:#2160c4; border-color:#c5d8f2; }
  .src-tag.def{ background:#f1f3f6; color:#5d6b7a; border-color:#dfe4ea; }
  .hours-table{ width:100%; border-collapse:collapse; margin:10px 0; font-size:13.5px; }
  .hours-table th, .hours-table td{ border:none; border-bottom:1px solid var(--border,#d5dbe3); padding:7px 8px; text-align:left; }
  .hours-table th{ background:#f7f9fb; font-size:12px; color:var(--sub,#5d6b7a); }
  .hours-add{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; border-top:1px dashed var(--border,#d5dbe3); padding-top:12px; }
  .hours-add label{ font-size:11.5px; color:var(--sub,#5d6b7a); font-weight:600; display:block; }
  .hours-add select, .hours-add input{ font:inherit; font-size:13.5px; padding:6px 8px; border:1px solid var(--border,#d5dbe3); border-radius:6px; }
  .closure-row{ display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border,#d5dbe3); font-size:13.5px; }
  .closure-row .cd{ font-weight:700; font-variant-numeric:tabular-nums; }
  .closure-row .cr{ color:var(--sub,#5d6b7a); }
  .closure-row button{ margin-left:auto; }
  @media print {
    .admin-header, .bk-modal-overlay, .toast-wrap { display:none !important; }
    .admin-view:not(.active){ display:none !important; }
    .tl-toolbar button, .tl-toolbar input, .tl-compact, .tl-axis-tabs { display:none !important; }
    .tl-toolbar .day{ font-size:15px; }
    .tl-wrap{ border:1px solid #999; overflow:visible; }
    main{ padding:6px; max-width:none; }
    body{ background:#fff; }
  }
  /* リソース設定 */
  .res-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:8px; }
  .res-card{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; }
  .res-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .res-name{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:14px; }
  .res-del{ width:32px; height:32px; flex:0 0 auto; border:1px solid var(--red); color:var(--red); background:#fff; border-radius:7px; font-size:18px; font-weight:700; cursor:pointer; line-height:1; }
  .res-del:hover{ background:var(--red-light); }
  .res-add{ display:flex; gap:8px; margin-top:10px; border-top:1px dashed var(--border); padding-top:12px; }
  .res-add input{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:14px; }
  .res-plus{ flex:0 0 auto; background:var(--green); color:#fff; border:none; border-radius:7px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .res-plus:hover{ filter:brightness(1.05); }
  /* 会計欄・未収（Wave5） */
  .banner-due{ background:#fff7ed; border:1px solid #fed7aa; border-left:4px solid #c9821f; border-radius:8px; padding:10px 14px; font-size:13px; margin:10px 0; }
  .badge.pay-unpaid{ background:#fef3c7; color:#92400e; }
  .badge.pay-paid{ background:#dcfce7; color:#166534; }
  .badge.pay-none{ background:#f1f5f9; color:#475569; }

  .pay-in{ font:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:#fff; width:100%; }
  /* メニュー台帳（Wave4） */
  .scroll-x{ overflow-x:auto; }
  .mn-table{ width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
  .mn-table th{ background:#f1f5f9; text-align:left; font-size:11.5px; color:#475569; padding:8px 9px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .mn-table td{ padding:8px 9px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .mn-table td.c{ text-align:center; }
  .mn-in{ font:inherit; font-size:12.5px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; background:#fff; width:88px; }
  .mn-in:disabled{ background:#f8fafc; color:#64748b; }
  .mn-chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .mn-chip{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; border:1px solid var(--border); border-radius:6px; padding:3px 7px; background:#fff; cursor:pointer; white-space:nowrap; }
  .mn-chip.on{ border-color:var(--green); background:#ecfdf5; color:#065f46; font-weight:700; }
  .mn-chip input{ margin:0; }
  .mn-add{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .mn-add input{ font:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:#fff; }
  .mn-add input:first-child{ min-width:220px; }
  .banner-info{ background:#eff6ff; border:1px solid #bfdbfe; border-left:4px solid var(--blue); border-radius:8px; padding:12px 14px; font-size:13px; margin:12px 0; }
  .primary{ background:var(--blue); color:#fff; border:none; border-radius:7px; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; }
  .primary:hover{ filter:brightness(1.05); }
  .ghost-del{ background:#fff; color:#b3402e; border:1px solid #e7c3bc; border-radius:6px; padding:4px 9px; font-size:12px; cursor:pointer; }
  .ghost-del:hover{ background:#fdf2f0; }
  /* 担当/機材 割当セレクト（日別ボード） */
  .assign-cell{ white-space:nowrap; }
  .assign-sel{ font:inherit; font-size:11.5px; padding:3px 5px; border:1px solid var(--border); border-radius:6px; background:#fff; cursor:pointer; max-width:118px; margin:1px 0; display:block; }
  .assign-sel.staff{ color:#0369a1; border-color:#bae6fd; background:#f0f9ff; }
  .assign-sel.device{ color:#b45309; border-color:#fde68a; background:#fffbeb; }
  /* 予約詳細モーダル */
  .bk-modal-overlay{ position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:flex-start; justify-content:center; z-index:200; padding:32px 16px; overflow:auto; }
  .bk-modal{ background:#fff; border-radius:14px; max-width:540px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .bk-head{ display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--border); }
  .bk-head h2{ margin:0; font-size:18px; }
  .bk-close{ background:none; border:none; font-size:24px; cursor:pointer; color:var(--sub); line-height:1; padding:0 4px; }
  .bk-body{ padding:16px 20px; }
  .bk-sec{ margin-bottom:16px; }
  .bk-sec h3{ font-size:11.5px; color:var(--sub); letter-spacing:.05em; margin:0 0 8px; font-weight:700; }
  .bk-row{ display:flex; gap:10px; margin-bottom:6px; font-size:14px; }
  .bk-row .k{ width:82px; color:var(--sub); flex:0 0 auto; }
  .bk-row .v{ font-weight:600; }
  .bk-assign{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .bk-assign label{ font-size:11px; color:var(--sub); display:block; margin-bottom:3px; font-weight:600; }
  .bk-assign select{ width:100%; font-size:13px; padding:7px 6px; border:1px solid var(--border); border-radius:7px; }
  .bk-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:14px 20px; border-top:1px solid var(--border); }
  .bk-plus{ color:var(--blue); cursor:pointer; text-decoration:underline; }
  tr .pt-link{ cursor:pointer; }
  tr .pt-link:hover{ text-decoration:underline; }
  .tl-blk{ cursor:grab; user-select:none; }
  .tl-blk:active{ cursor:grabbing; }
  .tl-blk.dragging{ outline:2px solid var(--blue); box-shadow:0 6px 16px rgba(0,0,0,.28); }
  .tl-blk.dragging::after{ content:attr(data-drop); position:absolute; top:1px; right:3px; background:rgba(15,23,42,.78); color:#fff; font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; }
  #tlGuide{ position:absolute; left:56px; right:0; height:0; border-top:2px dashed var(--blue); z-index:9; pointer-events:none; }
  #tlGuide .tg-label{ position:absolute; left:2px; top:-10px; background:var(--blue); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.3); }
</style>
</head>
<body>
<header class="admin-header">
  <div class="admin-header-top">
    <span class="brand">予約統括システム 受付ボード <small>リアルタイム同期</small></span>
    <span style="display:flex;gap:14px;align-items:center">
      <span class="latency" id="latency">同期待機中…</span>
      <a class="to-patient" href="index.html" target="_blank">患者向けサイトを開く ↗</a>
    </span>
  </div>
  <div class="clinic-switch" id="clinicSwitch"></div>
  <nav class="admin-tabs" id="adminTabs">
    <a class="tab active" data-tab="board" onclick="showAdminTab('board')">日別ボード</a>
    <a class="tab" data-tab="timeline" onclick="showAdminTab('timeline')">タイムライン</a>
    <a class="tab" data-tab="list" onclick="showAdminTab('list')">予約一覧</a>
    <a class="tab" data-tab="new" onclick="showAdminTab('new')">電話予約の代理入力</a>
    <a class="tab" data-tab="slots" onclick="showAdminTab('slots')">予約枠の確認</a>
    <a class="tab" data-tab="resources" onclick="showAdminTab('resources')">リソース設定</a>
    <a class="tab" data-tab="hours" onclick="showAdminTab('hours')">診療時間・休診日</a>

    <a class="tab" data-tab="import" onclick="showAdminTab('import')">CSV取り込み</a>
  </nav>
</header>
<main>
  <!-- 予約DBに接続できないときの警告（保存されないことを受付にはっきり伝える） -->
  <div id="connBar" style="display:none;margin:0 0 14px;padding:11px 16px;border:1px solid #fca5a5;border-left:5px solid #dc2626;background:#fef2f2;color:#7f1d1d;font-size:14px;font-weight:700;border-radius:6px"></div>
  <!-- 保存に失敗したときの警告（成功はトースト・失敗はバナー） -->
  <div id="failBar"></div>

  <!-- 日別ボード -->
  <div id="view-board" class="admin-view active">
    <div class="board-toolbar">
      <button class="secondary small" onclick="shift(-1)">‹ 前日</button>
      <input type="date" id="dateInput" onchange="setDate(this.value)">
      <button class="secondary small" onclick="shift(1)">翌日 ›</button>
      <span class="day" id="dayLabel"></span>
    </div>
    <div id="dayNote" class="day-note"></div>
    <div class="stat-row" id="stats"></div>
    <div id="board"></div>
  </div>

  <!-- タイムライン（時間軸×診察室） -->
  <div id="view-timeline" class="admin-view"></div>

  <!-- 予約一覧 -->
  <div id="view-list" class="admin-view"></div>

  <!-- 電話予約の代理入力 -->
  <div id="view-new" class="admin-view"></div>

  <!-- 予約枠の確認 -->
  <div id="view-slots" class="admin-view"></div>

  <!-- リソース設定（部屋/スタッフ/機材） -->
  <div id="view-resources" class="admin-view"></div>

  <!-- 診療時間・休診日 -->
  <div id="view-hours" class="admin-view"></div>

  <!-- 準備中 -->
  <div id="view-menus" class="admin-view"></div>
  <div id="view-import" class="admin-view"></div>
</main>

<!-- 予約詳細モーダル（ブロック/患者名クリックで開く） -->
<div id="bkModal" class="bk-modal-overlay" style="display:none" onclick="if(event.target===this)closeBooking()"></div>
<!-- 成功トースト（失敗は画面上部のバナーで出す） -->
<div id="toastWrap" class="toast-wrap"></div>

<script>window.__RSV_SUPABASE__ = true;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store.js?v=20260813w8"></script>
<script>
/* 受付ライブボード（タブ切替式）：患者予約が入った瞬間に日別ボード・予約一覧へ即反映 */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- 保存失敗の表示（黙って成功したように見せない） ----------------
   store.js は失敗の種類を reason で返す：
     DUPLICATE … DBの一意/排他制約が二重予約を拒否（同じ枠の同じ部屋/担当/機材）
     OFFLINE   … 予約DB（Supabase）へ接続できていない
     NETWORK   … 通信不達 ／ DB … その他DBエラー ／ COL_MISSING … DB列が未整備
   いずれも受付には必ず見せる（ローカルへ黙って保存する経路は廃止済み）。 */
function boardMsg(res, fallback){
  if(!res) return fallback || "保存できませんでした。";
  if(res.reason==="COL_MISSING" || res.error==="COL_MISSING") return "この環境では保存できません（DBの列追加が必要です）。";
  return res.error || fallback || "保存できませんでした。";
}
/* 成功＝トースト（作業を止めない） / 失敗＝画面上部のバナー（消えない・自分で閉じる）
   UI調査 B-9：alert() は作業を強制停止させ、連打の原因になるため置き換えた。 */
function toast(msg){
  const w=document.getElementById('toastWrap'); if(!w){ return; }
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  w.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 4000);
}
function failBar(msg){
  const box=document.getElementById('failBar'); if(!box){ return; }
  box.innerHTML=`<div class="fail-bar" role="alert"><span>⚠ ${esc(msg)}</span><button title="閉じる" onclick="document.getElementById('failBar').innerHTML=''">×</button></div>`;
  window.scrollTo(0,0);
}
function boardFail(res, fallback){
  console.error("[受付ボード] 保存に失敗しました:", res);
  failBar(boardMsg(res, fallback));
}
// 接続できていないときの警告バー
function renderConnBar(){
  const bar=document.getElementById('connBar'); if(!bar) return;
  if(Store.isOffline()){
    const e=Store.getBackendError()||{};
    bar.innerHTML = "⚠ 予約データベース（Supabase）に接続できていません。予約の登録・変更・取消は保存されません（この端末には保存しません）。"
      + `<span style="font-weight:400;font-size:12px;display:block;margin-top:3px">種別：${esc(e.reason||"-")}／${esc(e.message||"")}</span>`;
    bar.style.display='block';
  } else bar.style.display='none';
}

let curTab = "board";
let curDate = Store.todayStr();
let curClinic = 1;              // 表示中のクリニック（既定=西春）。demo.html右側はこれで切替
let prevCodes = new Set();

/* ---------------- クリニック切替（受付側の確認ウィンドウを院ごとに） ---------------- */
function curClinicObj(){ return Store.CLINICS.find(c=>c.id===curClinic) || Store.CLINICS[0]; }
function firstCsOfClinic(){ const c=curClinicObj(); return c && c.services[0] ? c.services[0].id : null; }
function inCurClinic(csId){ const c=Store.clinicOfCs(csId); return c && c.id===curClinic; }
function renderClinicSwitch(){
  const el=document.getElementById('clinicSwitch'); if(!el) return;
  el.innerHTML = '<span class="cs-label">クリニック：</span>' + Store.CLINICS.map(c=>
    `<button class="clinic-pill ${c.id===curClinic?'active':''}" onclick="setClinic(${c.id})">${esc(c.name)}${c.openingNote?'<small>開業前</small>':''}</button>`
  ).join("");
}
function setClinic(id){
  curClinic=id;
  nf.csId=null; slotsCs=null;          // 代理入力・枠確認の選択を新クリニックへ
  renderClinicSwitch();
  prevCodes = currentCodes();
  renderTab(curTab);
  loadDayNote();
}

/* ---------------- タブ切替 ---------------- */
function showAdminTab(id){
  curTab = id;
  document.querySelectorAll('#adminTabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===id));
  document.querySelectorAll('.admin-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  renderTab(id);
}
function renderTab(id){
  if(id==="board") renderBoard();
  else if(id==="timeline") renderTimeline();
  else if(id==="list") renderList();
  else if(id==="new") renderNew();
  else if(id==="slots") renderSlots();
  else if(id==="resources") renderResources();
  else if(id==="hours") renderHours();
  else if(id==="menus") renderMenus();
  else if(id==="import") renderPlaceholder("import");
}

/* ---------------- 日別ボード ---------------- */
function setDate(d){ curDate = d; renderBoard(); loadDayNote(); }
function shift(n){ curDate = Store.addDays(curDate, n); renderBoard(); loadDayNote(); }
/* 連絡事項（当日メモ・院×日付） */
async function loadDayNote(){
  const el=document.getElementById('dayNote'); if(!el) return;
  const note=await Store.getNote(curClinic, curDate);
  el.innerHTML=`<span class="dn-label">📌 ${esc(curClinicObj().name)} ${Store.fmtJa(curDate)} の連絡事項</span>
    <textarea id="dnText" placeholder="当日の申し送り・注意事項を記入（自動保存）" onblur="saveDayNote()">${esc(note||"")}</textarea>
    <span id="dnStatus" class="muted"></span>`;
}
async function saveDayNote(){
  const t=document.getElementById('dnText'); if(!t) return;
  const res=await Store.saveNote(curClinic, curDate, t.value);
  const s=document.getElementById('dnStatus');
  if(s){
    s.textContent = res.ok ? '✓ 保存しました' : '⚠ 保存できませんでした（内容は反映されていません）';
    s.style.color = res.ok ? '' : 'var(--red)';
    if(res.ok) setTimeout(()=>{ if(s) s.textContent=''; },1600);   // 失敗表示は消さない
  }
}
/* この院のその日の行。ブロック（休憩・機材メンテ）も含む＝タイムラインで使う */
function clinicRows(date){ return Store.dayReservations(date).filter(r=>inCurClinic(r.csId)); }
/* 患者予約だけ（日別ボードの表・統計・予約一覧はこちら） */
function patientRows(date){ return clinicRows(date).filter(r=>!Store.isBlock(r)); }
// 診察室バッジの色分けは「その院の部屋の並び順（偶数/奇数）」で決める（名称に依存しない）
function roomAlt(r){ return Store.roomIndex(r)%2===1; }
function roomTag(r){ const rm=Store.roomName(r); return rm?`<span class="room-badge ${roomAlt(r)?"r2":""}">${esc(rm)}</span>`:'<span class="muted" style="font-size:12px">—</span>'; }
// 診察室の切替プルダウン（受付が任意に変更／相手がいれば入れ替え）。選択肢＝この院の登録部屋
function roomSelect(r){
  const cur=Store.roomOf(r);
  const rooms=Store.roomsOfCs(r.csId);
  if(!rooms.length) return `<span class="muted" style="font-size:11px">部屋未登録</span>`;
  const opts=rooms.map(rm=>`<option value="${rm.id}" ${Number(rm.id)===Number(cur)?'selected':''}>${esc(rm.name)}</option>`).join("");
  return `<select class="room-sel ${roomAlt(r)?'r2':''}" title="診察室を変更" onchange="switchRoom('${esc(r.code)}', this.value)">${opts}</select>`;
}
async function switchRoom(code, roomId){
  const res=await Store.setRoom(code, roomId);
  if(!res.ok){ boardFail(res, "診察室を変更できませんでした。"); }
  afterMutate();   // 失敗時も store 側で最新状態を再読込済み。表示を戻す
}
// スタッフ/機材の割当セレクト（受付ボードから任意割当・被りは拒否）
function resSelect(r, kind){
  const cur = kind==="staff"?r.staffId:r.deviceId;
  const list = Store.resourcesOf(curClinic, kind);
  if(!list.length) return `<span class="muted" style="font-size:11px">${kind==='staff'?'担当':'機材'}未登録</span>`;
  const opts = `<option value="">${kind==="staff"?'担当…':'機材…'}</option>`+list.map(x=>`<option value="${x.id}" ${Number(cur)===Number(x.id)?'selected':''}>${esc(x.name)}</option>`).join("");
  return `<select class="assign-sel ${kind}" onchange="assignRes('${esc(r.code)}','${kind}',this.value)">${opts}</select>`;
}
async function assignRes(code, kind, val){
  const res=await Store.assignResource(code, kind, val||null);
  if(!res.ok){ boardFail(res, (kind==='staff'?"担当":"機材")+"の割当を保存できませんでした。"); }
  afterMutate();   // 失敗時も store 側で最新状態を再読込済み。セレクトの表示を実データへ戻す
}

/* ---------------- 予約詳細モーダル（クリックで詳細・割当編集） ---------------- */
function ageFrom(birth){ try{ const [y,m,d]=birth.split("-").map(Number); const t=new Date(); let a=t.getFullYear()-y; if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))a--; return a>=0&&a<130?a:null; }catch{ return null; } }
function openBooking(code){
  if(_tlDragged) return;                                  // ドラッグ直後のクリックは無視
  const r=Store.loadReservations().find(x=>x.code===code); if(!r) return;
  if(Store.isBlock(r)) return openBlock(r.blockGroup||r.code);   // 非患者ブロックは専用の画面へ
  const clinic=Store.clinicOfCs(r.csId), svc=Store.serviceOfCs(r.csId), menu=r.menuId?Store.menuById(r.menuId):null, cid=clinic.id;
  const dur=Store.durMin(r), end=tlHHMM(tlToMin(r.time)+dur), age=r.birthDate?ageFrom(r.birthDate):null;
  const stMap={CONFIRMED:['予約確定','confirmed'],VISITED:['来院済','visited'],CANCELLED:['キャンセル','cancelled'],NO_SHOW:['不履行','no-show']};
  const st=stMap[r.status]||[r.status,'confirmed'];
  const rooms=Store.roomsOfCs(r.csId);
  const roomOpts=rooms.length
    ? rooms.map(rm=>`<option value="${rm.id}" ${Number(Store.roomOf(r))===Number(rm.id)?'selected':''}>${esc(rm.name)}</option>`).join("")
    : `<option value="">（部屋が未登録です）</option>`;
  const staffOpts=`<option value="">担当なし</option>`+Store.resourcesOf(cid,'staff').map(x=>`<option value="${x.id}" ${Number(r.staffId)===Number(x.id)?'selected':''}>${esc(x.name)}</option>`).join("");
  const devOpts=`<option value="">機材なし</option>`+Store.resourcesOf(cid,'device').map(x=>`<option value="${x.id}" ${Number(r.deviceId)===Number(x.id)?'selected':''}>${esc(x.name)}</option>`).join("");
  document.getElementById('bkModal').innerHTML=`<div class="bk-modal" onclick="event.stopPropagation()">
    <div class="bk-head"><h2>予約詳細</h2><button class="bk-close" onclick="closeBooking()">×</button></div>
    <div class="bk-body">
      <div class="bk-sec"><span class="badge ${st[1]}" style="font-size:12.5px">${st[0]}</span> <span class="muted" style="font-size:12px;margin-left:6px">予約番号 ${esc(r.code)}</span></div>
      <div class="bk-sec"><h3>患者</h3>
        <div class="bk-row"><span class="k">お名前</span><span class="v">${esc(r.name)} 様 ${r.visitType==="FIRST"?'<span class="badge first">初診</span>':(r.visitType==="REVISIT"?'<span class="badge confirmed">再診</span>':'')}</span></div>
        ${r.kana?`<div class="bk-row"><span class="k">フリガナ</span><span class="v">${esc(r.kana)}</span></div>`:""}
        ${r.birthDate?`<div class="bk-row"><span class="k">生年月日</span><span class="v">${esc(r.birthDate)}${age!=null?`（${age}歳）`:""}</span></div>`:""}
        <div class="bk-row"><span class="k">電話</span><span class="v">${esc(r.phone)}</span></div>
        ${r.email?`<div class="bk-row"><span class="k">メール</span><span class="v">${esc(r.email)}</span></div>`:""}
        <div class="bk-row"><span class="k">LINE通知</span><span class="v" style="color:${r.lineUserId?'#06c755':'var(--sub)'}">${r.lineUserId?'連携済み（予約確定時に自動送信）':'未連携'}</span></div>
        <div class="bk-row"><span class="k">同意</span><span class="v" style="color:${r.consentAt?'var(--green)':'var(--sub)'}">${r.consentAt?`取得済み（${new Date(r.consentAt).toLocaleString('ja-JP')}・規約 ${esc(r.consentVersion||'-')}）`:'記録なし（この予約は同意記録の追加前に作成されました）'}</span></div>
      </div>
      <div class="bk-sec"><h3>予約内容</h3>
        <div class="bk-row"><span class="k">クリニック</span><span class="v">${esc(clinic.name)}（${esc(svc.name)}）</span></div>
        ${menu?`<div class="bk-row"><span class="k">メニュー</span><span class="v">${esc(menu.name)}</span></div>`:""}
        <div class="bk-row"><span class="k">日時</span><span class="v">${Store.fmtJa(r.date)} ${r.time}〜${end}（${dur}分）</span></div>
        <div class="bk-row"><span class="k">経路</span><span class="v">${r.channel==="WEB"?"Web予約":r.channel==="PHONE"?"電話予約":esc(r.channel)}</span></div>
        ${r.note?`<div class="bk-row"><span class="k">ご要望</span><span class="v" style="font-weight:400">${esc(r.note)}</span></div>`:""}
      </div>
      <div class="bk-sec"><h3>リソース割当（変更すると同時間帯の被りは自動で拒否）</h3>
        <div class="bk-assign">
          <div><label>診察室</label><select onchange="bkSet('${esc(r.code)}','room',this.value)">${roomOpts}</select></div>
          <div><label>担当スタッフ</label><select onchange="bkSet('${esc(r.code)}','staff',this.value)">${staffOpts}</select></div>
          <div><label>使用機材</label><select onchange="bkSet('${esc(r.code)}','device',this.value)">${devOpts}</select></div>
        </div>
      </div>
      <div class="bk-sec"><h3>会計</h3>
        <div class="bk-assign">
          <div><label>金額（円）</label><input id="bkAmount" class="pay-in" type="number" min="0" step="100" value="${r.amount??(menu&&menu.price?menu.price:'')}" placeholder="0"></div>
          <div><label>支払方法</label><select id="bkMethod" class="pay-in"><option value="">未設定</option>${Store.PAY_METHOD.map(m=>`<option value="${m.v}" ${r.paymentMethod===m.v?'selected':''}>${esc(m.label)}</option>`).join("")}</select></div>
          <div><label>支払状態</label><select id="bkPayStatus" class="pay-in"><option value="">未設定</option>${Store.PAY_STATUS.map(s=>`<option value="${s.v}" ${r.paymentStatus===s.v?'selected':''}>${esc(s.label)}</option>`).join("")}</select></div>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button class="secondary" onclick="bkSavePayment('${esc(r.code)}')">会計を記録する</button>
          <span class="muted" style="font-size:11.5px">カード番号は入力しません。オンライン決済は費用のご承認後に接続します。</span>
        </div>
      </div>
    </div>
    <div class="bk-actions">
      ${r.status==="CONFIRMED"?`<button onclick="bkStatus('${esc(r.code)}','VISITED')">来院にする</button>`:""}
      ${r.status!=="CANCELLED"?`<button class="danger" onclick="bkStatus('${esc(r.code)}','CANCELLED')">予約を取消</button>`:`<button class="secondary" onclick="bkStatus('${esc(r.code)}','CONFIRMED')">取消を戻す</button>`}
      <button class="secondary" style="margin-left:auto" onclick="closeBooking()">閉じる</button>
    </div>
  </div>`;
  document.getElementById('bkModal').style.display='flex';
}
function closeBooking(){ const m=document.getElementById('bkModal'); m.style.display='none'; m.innerHTML=''; }
async function bkSet(code, kind, val){
  const res = (kind==='room') ? await Store.setRoom(code, val) : await Store.assignResource(code, kind, val||null);
  if(!res.ok){ boardFail(res, "割当を保存できませんでした。"); }
  afterMutate(); openBooking(code);   // 再描画で実データの割当に戻る
}
/* 会計の記録（①カード決済の承認前準備）。Stripe接続前でも受付が金額と支払状態を残せる。 */
async function bkSavePayment(code){
  const amount=(document.getElementById('bkAmount')||{}).value;
  const method=(document.getElementById('bkMethod')||{}).value;
  const status=(document.getElementById('bkPayStatus')||{}).value;
  const res=await Store.setPayment(code, { amount, method: method||null, status: status||null });
  if(!res.ok){ boardFail(res, "会計を記録できませんでした。"); }
  else toast("会計を記録しました。");
  afterMutate(); openBooking(code);
}
async function bkStatus(code, status){
  if(status==="CANCELLED" && !confirm("この予約を取り消しますか？")) return;
  const res = await Store.updateStatus(code, status);
  if(res && !res.ok){ boardFail(res, "予約の状態を変更できませんでした。"); afterMutate(); openBooking(code); return; }
  if(status==="CANCELLED"){ closeBooking(); afterMutate(); return; }
  afterMutate(); openBooking(code);
}

/* ---------------- タイムライン 空き枠クリック → 「予約」か「ブロック」を選ぶ ---------------- */
function tlColClick(ci, ev){
  if(curClinicObj().openingNote) return;                 // 開業前は不可
  const col=ev.currentTarget; const rect=col.getBoundingClientRect();
  let min = tlState.sMin + Math.round(((ev.clientY - rect.top)/tlState.ppm)/30)*30;   // 30分スナップ
  const time = tlHHMM(Math.max(tlState.sMin, min));
  const rc = tlState.resList[ci];
  const prefill = { time };
  // 未割当列（rc.unassigned）は割当なしで作成する（＝リソースを指定しない新規予約）
  if(rc && !rc.unassigned){
    if(tlState.axis==="room") prefill.roomId = rc.id;
    else if(tlState.axis==="staff") prefill.staffId = rc.id;
    else if(tlState.axis==="device") prefill.deviceId = rc.id;
  }
  openSlotChoice(prefill, rc);
}

/* ---------------- タイムライン ドラッグで時刻・リソース変更 ---------------- */
let _tlDrag=null, _tlDragged=false;
function columnOfBooking(code){
  const r=Store.loadReservations().find(x=>x.code===code); if(!r) return -1;
  const rid = tlState.axis==='room' ? Store.roomOf(r) : (tlState.axis==='staff' ? r.staffId : r.deviceId);
  const i = (rid==null) ? -1 : tlState.resList.findIndex(x=>Number(x.id)===Number(rid));
  if(i>=0) return i;
  return tlState.resList.findIndex(x=>x.unassigned);   // 未割当列（無ければ-1）
}
function tlDragStart(ev, code){
  if(ev.button!==0) return;
  ev.preventDefault();
  const blk=ev.currentTarget;
  _tlDrag={ code, blk, startX:ev.clientX, startY:ev.clientY, origTop:parseInt(blk.style.top)||0, moved:false, snapMin:null };
  document.addEventListener('mousemove', tlDragMove);
  document.addEventListener('mouseup', tlDragEnd);
}
function snapMinAt(clientY, colEl){
  const rect=colEl.getBoundingClientRect();
  let min=tlState.sMin+Math.round(((clientY-rect.top)/tlState.ppm)/30)*30;
  return Math.max(tlState.sMin, min);
}
function tlDragMove(ev){
  if(!_tlDrag) return;
  const dy=ev.clientY-_tlDrag.startY, dx=ev.clientX-_tlDrag.startX;
  if(Math.abs(dy)>3||Math.abs(dx)>3){ _tlDrag.moved=true; _tlDrag.blk.classList.add('dragging'); }
  if(!_tlDrag.moved) return;
  // カーソル下の列を特定
  const cols=[...document.querySelectorAll('#view-timeline .tl-col')];
  let col=_tlDrag.blk.parentElement;
  cols.forEach(c=>{ const r=c.getBoundingClientRect(); if(ev.clientX>=r.left && ev.clientX<r.right) col=c; });
  const min=snapMinAt(ev.clientY, col);
  const dur=Store.durMin(Store.loadReservations().find(x=>x.code===_tlDrag.code)||{});
  _tlDrag.snapMin=min; _tlDrag.snapCol=col;
  // ブロックを30分グリッドにスナップ表示＋ドロップ時刻ラベル
  _tlDrag.blk.style.top=((min-tlState.sMin)*tlState.ppm)+'px';
  _tlDrag.blk.style.opacity='.9'; _tlDrag.blk.style.zIndex='8';
  _tlDrag.blk.setAttribute('data-drop', tlHHMM(min)+'〜'+tlHHMM(min+dur));
  showDropGuide(min);
}
function showDropGuide(min){
  const grid=document.querySelector('#view-timeline .tl-grid'); if(!grid) return;
  let g=document.getElementById('tlGuide');
  if(!g){ g=document.createElement('div'); g.id='tlGuide'; grid.appendChild(g); }
  g.style.top=(34+(min-tlState.sMin)*tlState.ppm)+'px';
  g.innerHTML=`<span class="tg-label">${tlHHMM(min)}</span>`;
  g.style.display='block';
}
function hideDropGuide(){ const g=document.getElementById('tlGuide'); if(g) g.remove(); }
async function tlDragEnd(ev){
  document.removeEventListener('mousemove', tlDragMove);
  document.removeEventListener('mouseup', tlDragEnd);
  const d=_tlDrag; _tlDrag=null; hideDropGuide();
  if(!d) return;
  if(!d.moved){ d.blk.style.opacity=''; d.blk.style.zIndex=''; d.blk.classList.remove('dragging'); return; }   // 動いてない＝クリック（詳細）
  _tlDragged=true; setTimeout(()=>{_tlDragged=false;}, 350);
  const cols=[...document.querySelectorAll('#view-timeline .tl-col')];
  let newCi=-1; cols.forEach((c,i)=>{ const r=c.getBoundingClientRect(); if(ev.clientX>=r.left && ev.clientX<r.right) newCi=i; });
  const min = (d.snapMin!=null) ? d.snapMin : snapMinAt(ev.clientY, cols[Math.max(0,newCi)]||cols[0]);
  const newTime=tlHHMM(min);
  const oldCi=columnOfBooking(d.code);
  // まず列（リソース）を変更 → 次に時刻移動（どちらも被りは拒否）
  let res={ok:true};
  if(newCi>=0 && newCi!==oldCi && tlState.resList[newCi]){
    const rc=tlState.resList[newCi];
    if(rc.unassigned){
      // 未割当列へ戻す＝担当/機材の割当を外す。診察室は必ずどこかの室に入るため外せない。
      if(tlState.axis==='room') res={ ok:false, error:"診察室は「未割当」へは戻せません。別の診察室の列へ移動してください。" };
      else res=await Store.assignResource(d.code, tlState.axis, null);
    }
    else if(tlState.axis==='room') res=await Store.setRoom(d.code, rc.id);
    else if(tlState.axis==='staff') res=await Store.assignResource(d.code,'staff', rc.id);
    else if(tlState.axis==='device') res=await Store.assignResource(d.code,'device', rc.id);
  }
  if(res.ok) res=await Store.moveReservation(d.code, newTime);
  if(!res.ok) boardFail(res, "予約を移動できませんでした。");
  afterMutate(); renderTimeline();   // 失敗時は最新状態で描き直す＝ブロックは元の位置へ戻る
}

async function markVisited(code){
  const res = await Store.updateStatus(code, "VISITED");
  if(res && !res.ok) boardFail(res, "来院済みにできませんでした。"); else toast("来院済みにしました。");
  afterMutate();
}
async function cancelRes(code){
  if(!confirm("この予約を取り消しますか？")) return;
  const res = await Store.updateStatus(code, "CANCELLED");
  if(res && !res.ok) boardFail(res, "予約を取り消せませんでした。"); else toast("予約を取り消しました。");
  afterMutate();
}
async function resetDemo(){
  if(!confirm("デモ初期化：SEED以外の予約データをすべて削除します。よろしいですか？")) return;
  const res = await Store.resetDemo();
  if(res && !res.ok) boardFail(res, "デモ初期化に失敗しました。");
  afterMutate();
}
function afterMutate(){ prevCodes = currentCodes(); renderTab(curTab); }

/* ---------------- タイムライン（時間軸 × 診察室・全院対応） ---------------- */
function tlToMin(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function tlHHMM(min){ return `${String(Math.floor(min/60)).padStart(2,"0")}:${String(min%60).padStart(2,"0")}`; }
function resDurMin(r){
  if(r.menuId){ const m=Store.menuById(r.menuId); if(m&&m.durationMin) return m.durationMin; }
  const s=Store.serviceOfCs(r.csId); return (s&&s.name==="在宅")?60:30;
}
let tlAxis="room";
let tlCompact=false;                                  // 縮小表示
let tlState={ sMin:540, axis:"room", resList:[], ppm:1 };   // 空き枠クリック用に現在の描画状態を保持
const AXIS_LABEL={room:"ルーム",staff:"スタッフ",device:"機材"};
const AXIS_NOUN={room:"診察室",staff:"担当",device:"機材"};
function setTlAxis(k){ tlAxis=k; renderTimeline(); }
/* ---- 未割当の判定（Wave2 / 仕様書v2 §3.2-A・欠陥D-5） ----
   患者Web予約は担当・機材が未設定（null）で入るため、割当済みだけを描くと軸から消えてしまう。
   その軸のリソースが割り当たっていない予約を「未割当」列に集めて、受付が見落とさないようにする。
   room軸では通常 roomOf が自動導出するので空になるが、部屋を減らして登録外になった予約は
   ここに出す（＝室数を減らしても予約が画面から消えない）。 */
function tlUnassigned(rows, axis, resList){
  return rows.filter(r=>{
    const id = axis==='room' ? Store.roomOf(r) : (axis==='staff' ? r.staffId : r.deviceId);
    return id==null || !resList.some(x=>Number(x.id)===Number(id));
  });
}
// 軸タブに出す「割当待ち」件数（表示中の院・日付。ブロックは対象外）
function tlUnassignedCount(axis){
  const rows=patientRows(curDate);
  return tlUnassigned(rows, axis, Store.resourcesOf(curClinic, axis)).length;
}
/* ---- 診療区分の色クラス（UI調査 B-3：色＝診療区分の意味に統一） ---- */
const SVC_CLASS={ "外来":"svc-gairai", "在宅":"svc-zaitaku", "美容":"svc-biyou", "夜間休日":"svc-yakan" };
function svcClassOf(r){ const s=Store.serviceOfCs(r.csId); return (s&&SVC_CLASS[s.name])||"svc-gairai"; }
function statusClassOf(r){ return r.status==="VISITED"?"visited":(r.status==="CANCELLED"?"cancelled":""); }
/* ---- 診療時間外（休診帯）の判定（UI調査 B-6） ----
   その院のいずれかの診療区分が開いている分だけを「診療時間内」とみなし、
   1時間まるごと閉じている行をグレーにする。臨時休診の日は全部グレーになる。 */
function tlOpenRanges(clinic, date){
  const out=[];
  clinic.services.forEach(s=>{
    const step=Store.slotStepOf(s.id, date);
    Store.daySlotTimes(s.id, date).forEach(t=>{ const m=tlToMin(t); out.push([m, m+step]); });
  });
  return out;
}
function tlHourClosed(ranges, hourMin){
  return !ranges.some(([s,e])=> s < hourMin+60 && hourMin < e);
}
/* ---- ブロック（休憩・機材メンテ）を group 単位にまとめる ----
   ブロックは30分ごとに1行で保存しているので、表示は連続した行を1本に畳む。 */
function tlBlockGroups(blocks){
  const map=new Map();
  blocks.forEach(b=>{
    const key=b.blockGroup||b.code;
    const st=tlToMin(b.time), en=st+(Store.BLOCK_STEP||30);
    const g=map.get(key);
    if(g){ g.st=Math.min(g.st,st); g.en=Math.max(g.en,en); g.rows.push(b); }
    else map.set(key,{ group:key, st, en, kind:b.kind, label:Store.blockLabel(b), rows:[b],
                       roomId:b.roomId, staffId:b.staffId, deviceId:b.deviceId, csId:b.csId });
  });
  return [...map.values()];
}
function renderTimeline(){
  const clinic=curClinicObj();
  const allRows=clinicRows(curDate).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const rows=allRows.filter(r=>!Store.isBlock(r));            // 患者予約
  const blockGroups=tlBlockGroups(allRows.filter(r=>Store.isBlock(r)));   // 非患者ブロック
  const resList=Store.resourcesOf(clinic.id, tlAxis);          // この院×この軸のリソース＝列
  // 表示レンジ（9:00-18:00基準・予約／ブロックに合わせて拡張）
  let sMin=9*60, eMin=18*60;
  rows.forEach(r=>{ const st=tlToMin(r.time), en=st+resDurMin(r);
    if(st<sMin) sMin=Math.floor(st/60)*60; if(en>eMin) eMin=Math.ceil(en/60)*60; });
  blockGroups.forEach(g=>{ if(g.st<sMin) sMin=Math.floor(g.st/60)*60; if(g.en>eMin) eMin=Math.ceil(g.en/60)*60; });
  const hours=[]; for(let m=sMin;m<eMin;m+=60) hours.push(m);
  const HEAD=34, PPM=tlCompact?0.66:1;         // 縮小は0.5→0.66（0.5だと文字が潰れる／UI調査 B-14）
  const openRanges=tlOpenRanges(clinic, curDate);
  // 未割当（仮想列）を先頭に足す。staff/device軸は常に表示（割当待ちの受け皿）、
  // room軸は「登録外の部屋を指す予約」がある時だけ表示する。
  const unRows=tlUnassigned(rows, tlAxis, resList);
  const showUn=(tlAxis!=="room") || unRows.length>0;
  const colList=showUn ? [{ id:null, name:"未割当", unassigned:true }].concat(resList) : resList.slice();
  tlState={ sMin, axis:tlAxis, resList:colList, ppm:PPM };   // 空き枠クリック/ドラッグで参照
  const hrHtml=hours.map(m=>`<div class="hr ${tlHourClosed(openRanges,m)?'closed':''}" style="height:${60*PPM}px">${tlHHMM(m)}</div>`).join("");
  const gridHr=hours.map(m=>`<div class="hr ${tlHourClosed(openRanges,m)?'closed':''}" style="height:${60*PPM}px"></div>`).join("");
  const axisTabs=["room","staff","device"].map(k=>{
    const n=tlUnassignedCount(k);
    return `<button class="tl-axis-btn ${tlAxis===k?'on':''}" onclick="setTlAxis('${k}')">${AXIS_LABEL[k]}${n?`<span class="u-badge" title="${AXIS_NOUN[k]}が未割当の予約">${n}</span>`:""}</button>`;
  }).join("");
  const toolbar=`<div class="tl-toolbar">
      <button class="secondary small" onclick="shift(-1);renderTimeline()">‹ 前日</button>
      <input type="date" value="${curDate}" onchange="setDate(this.value);renderTimeline()">
      <button class="secondary small" onclick="shift(1);renderTimeline()">翌日 ›</button>
      <span class="day">${esc(clinic.name)}クリニック ／ ${Store.fmtJa(curDate)}</span>
      <label class="tl-compact" style="margin-left:auto"><input type="checkbox" ${tlCompact?'checked':''} onchange="tlCompact=this.checked;renderTimeline()"> 縮小</label>
      <button class="secondary small no-print" onclick="window.print()">印刷</button>
      <span class="tl-axis-tabs">${axisTabs}</span>
    </div>`;
  const box=document.getElementById("view-timeline");
  if(!colList.length){
    box.innerHTML = toolbar + `<div class="card">この院の「${AXIS_LABEL[tlAxis]}」が未登録です。<a onclick="showAdminTab('resources')" style="color:var(--blue);cursor:pointer;font-weight:700">リソース設定</a>から追加してください。</div>`;
    return;
  }
  const head=`<div class="tl-head-cell">時刻</div>`+colList.map(rc=>rc.unassigned
      ? `<div class="tl-head-cell unassigned" title="${AXIS_NOUN[tlAxis]}が割り当てられていない予約。ドラッグで右の列へ割り当てられます">未割当<span class="u-count">割当待ち ${unRows.length}件</span></div>`
      : `<div class="tl-head-cell">${esc(rc.name)}</div>`).join("");
  const axis=`<div class="tl-axis">${hrHtml}</div>`;
  const cols=colList.map((rc,ci)=>{
    // room軸: 予約のroomOf(=リソースID)で列を決める。staff/device軸: 予約のstaffId/deviceIdで割当。
    // 先頭が未割当列のときは、その軸のリソースが未設定/登録外の予約をまとめて置く。
    const colBookings = rc.unassigned ? unRows
      : (tlAxis==="room")
        ? rows.filter(r=>Number(Store.roomOf(r))===Number(rc.id))
        : rows.filter(r=> Number(tlAxis==="staff"?r.staffId:r.deviceId) === Number(rc.id));
    // 同じ列で時間帯が重なるブロックは横に並べる（未割当列に同時刻が積み上がると1件しか見えないため）
    const items=colBookings.map(r=>({ r, st:tlToMin(r.time), en:tlToMin(r.time)+resDurMin(r) }));
    items.forEach(it=>{ const ov=items.filter(o=>o.st<it.en && it.st<o.en); it.n=ov.length; it.i=ov.indexOf(it); });
    const blks=items.map(it=>{
      const r=it.r;
      const st=it.st, dur=resDurMin(r), end=st+dur;
      const top=(st-sMin)*PPM, h=Math.max(16,dur*PPM);
      const w=`calc((100% - 6px) / ${it.n})`, left=`calc(3px + (100% - 6px) * ${it.i} / ${it.n})`;
      const svc=Store.serviceOfCs(r.csId), menu=r.menuId?Store.menuById(r.menuId):null;
      // 色＝診療区分（左4px）／状態＝塗り・打消し／未割当＝破線（UI調査 B-3）
      const cls=[svcClassOf(r), statusClassOf(r), rc.unassigned?'un':''].filter(Boolean).join(' ');
      return `<div class="tl-blk ${cls}" style="top:${top}px;height:${h}px;left:${left};width:${w};right:auto"
                onmousedown="tlDragStart(event,'${esc(r.code)}')"
                onclick="event.stopPropagation();openBooking('${esc(r.code)}')"
                title="${esc(r.name)}様 ${r.time}-${tlHHMM(end)} / ${esc(menu?menu.name:svc.name)}（クリックで詳細・ドラッグで移動）">
        <div class="w">${esc(r.name)} 様${r.channel==="PHONE"?' 📞':''}</div>
        <div class="m">${r.time}-${tlHHMM(end)}・${esc(menu?menu.name:svc.name)}</div>
      </div>`;
    }).join("");
    // 非患者ブロック（休憩・機材メンテ・院内業務）。
    //   ・この列のリソースに紐づくブロック
    //   ・リソース指定なし（＝院全体の休止）は、未割当以外の全列に出す
    const colBlocks = rc.unassigned ? [] : blockGroups.filter(g=>{
      const id = tlAxis==='room' ? g.roomId : (tlAxis==='staff' ? g.staffId : g.deviceId);
      const noRes = g.roomId==null && g.staffId==null && g.deviceId==null;
      return noRes || (id!=null && Number(id)===Number(rc.id));
    });
    const blkHtml=colBlocks.map(g=>{
      const top=(g.st-sMin)*PPM, h=Math.max(16,(g.en-g.st)*PPM);
      const whole=(g.roomId==null && g.staffId==null && g.deviceId==null);
      return `<div class="tl-blk blk" style="top:${top}px;height:${h}px"
                onclick="event.stopPropagation();openBlock('${esc(g.group)}')"
                title="${esc(g.label)} ${tlHHMM(g.st)}-${tlHHMM(g.en)}（クリックで削除できます）">
        <div class="w">${esc(g.label)}${whole?'（院全体）':''}</div>
        <div class="m">${tlHHMM(g.st)}-${tlHHMM(g.en)}・${esc(Store.blockKindLabel(g.kind))}</div>
      </div>`;
    }).join("");
    return `<div class="tl-col ${rc.unassigned?'unassigned':''}" onclick="tlColClick(${ci}, event)" title="空き部分をクリックで新規予約／ブロック登録">${gridHr}${blkHtml}${blks}</div>`;
  }).join("");
  let now="";
  if(curDate===Store.todayStr()){
    const d=new Date(), nm=d.getHours()*60+d.getMinutes();
    // 現在時刻ラインに時刻ラベルを付ける（UI調査 B-6：赤線がどの時刻かを目測させない）
    if(nm>=sMin && nm<=eMin) now=`<div class="tl-now" style="top:${HEAD+(nm-sMin)*PPM}px;left:56px;right:0"><span class="now-label">${tlHHMM(nm)}</span></div>`;
  }
  const legend = `<div class="slot-legend" style="margin-top:10px">
      <span><i style="background:#fff;border-left:4px solid #2160c4"></i>外来</span>
      <span><i style="background:#fff;border-left:4px solid #0e7a5f"></i>在宅</span>
      <span><i style="background:#fff;border-left:4px solid #a13a70"></i>美容</span>
      <span><i style="background:#fff;border-left:4px solid #5b4bb5"></i>夜間休日</span>
      <span><i style="background:repeating-linear-gradient(135deg,#eceff3 0 4px,#dde2e8 4px 8px)"></i>休憩・機材メンテ等のブロック</span>
      <span><i style="background:#fffbeb;border:1px dashed #d99a24"></i>未割当</span>
      <span><i style="background:#f1f4f7"></i>診療時間外</span>
    </div>`;
  const note = (tlAxis==="room")
    ? "診察室ごとの時系列。予約が入ると即反映されます。列＝この院に登録された部屋（「リソース設定」で増減でき、枠の定員もその室数になります）。<b>空き部分をクリックすると、予約か「ブロック（休憩・機材メンテ）」を登録できます。</b>"
    : `「${AXIS_LABEL[tlAxis]}」の列は「リソース設定」で編集できます。左端の<b>未割当</b>列は${AXIS_NOUN[tlAxis]}が決まっていない予約（Web予約は未割当で入ります）。<b>ドラッグで列へ移すと割り当てられます</b>（同じ時間帯の重複はDBが拒否します）。`
      + (resList.length ? "" : `<br>この院の「${AXIS_LABEL[tlAxis]}」が未登録です。<a onclick="showAdminTab('resources')" style="color:var(--blue);cursor:pointer;font-weight:700">リソース設定</a>から追加してください。`);
  box.innerHTML = toolbar +
    `<div class="tl-wrap"><div class="tl-grid" style="--cols:${colList.length};position:relative">${head}${axis}${cols}${now}</div></div>
     ${legend}
     <p class="muted" style="margin-top:6px">${note}</p>`;
}

/* ---------------- リソース設定（部屋/スタッフ/機材・＋/−で増減） ---------------- */
const RES_KIND=[["room","部屋","第1診察室"],["staff","スタッフ","島原医師"],["device","機材","ハイフ機"]];
function renderResources(){
  const clinic=curClinicObj();
  const sections=RES_KIND.map(([kind,label,eg])=>{
    const items=Store.resourcesOf(clinic.id, kind);
    const rows=items.map(r=>`<div class="res-row">
        <input class="res-name" value="${esc(r.name)}" onchange="resRename(${r.id}, this.value)">
        <button class="res-del" title="削除" onclick="resDelete(${r.id}, ${JSON.stringify(r.name)})">−</button>
      </div>`).join("") || `<div class="muted" style="padding:6px 2px">未登録</div>`;
    return `<div class="res-card">
      <h3 style="margin-top:0">${label}<span class="muted" style="font-weight:400;font-size:12px;margin-left:8px">${items.length}件</span></h3>
      ${rows}
      <div class="res-add">
        <input id="resAdd_${kind}" placeholder="${label}名（例：${eg}）" onkeydown="if(event.key==='Enter')resAdd('${kind}')">
        <button class="res-plus" onclick="resAdd('${kind}')">＋ 追加</button>
      </div>
    </div>`;
  }).join("");
  document.getElementById("view-resources").innerHTML=`
    <h1>リソース設定<span class="muted" style="font-size:15px;font-weight:400;margin-left:8px">${esc(clinic.name)}クリニック</span></h1>
    <p class="muted">この院の「部屋・スタッフ・機材」を管理します。<b>＋で追加・−で削除</b>、名称は直接編集できます。ここで登録したものが<b>タイムラインの列</b>になります（クリニック切替で院ごとに設定）。</p>
    <div class="res-grid">${sections}</div>
    <!-- 全データ破壊系の操作は、画面で最も目立つ位置・最も押したくなる色から外す（UI調査 B-2） -->
    <div class="danger-zone">
      <div class="dz-note">デモ用の操作です。<b>SEED以外の予約データをすべて削除</b>し、サンプルの3件に戻します。実データが入っている環境では使用しないでください。</div>
      <button class="quiet" onclick="resetDemo()">デモ初期化（予約データを削除）</button>
    </div>`;
}
async function resAdd(kind){
  const el=document.getElementById('resAdd_'+kind); const name=(el.value||'').trim();
  if(!name){ el.focus(); return; }
  el.disabled=true;
  try{ await Store.addResource(curClinic, kind, name); }catch(e){ alert('追加できませんでした：'+(e&&e.message||'')); }
  renderResources();
}
async function resRename(id,name){ name=(name||'').trim(); if(!name){ renderResources(); return; } try{ await Store.renameResource(id,name); }catch(e){ alert('保存できませんでした'); renderResources(); } }
async function resDelete(id,name){ if(!confirm(`「${name}」を削除しますか？`)) return; try{ await Store.removeResource(id); }catch(e){ alert('削除できませんでした'); } renderResources(); }

/* ---------------- メニュー（rsv2_menus）＋「使う機材・担当」の紐づけ ----------------
   ここで登録した「使う機材／担当」が、患者がWeb予約した瞬間の自動割当に使われる。
   同型機を2台登録しておけば、1台が埋まっていてももう1台で予約を受けられる。 */
function menuCsOf(clinic){
  // メニューを持つ診療区分（いまは美容）。無ければその院の先頭区分を対象にする
  const biyou = clinic.services.find(s=>s.name==="美容");
  return biyou ? biyou.id : (clinic.services[0] ? clinic.services[0].id : null);
}

  const clinic=curClinicObj();
  const csId=menuCsOf(clinic);
  const svc=csId?Store.serviceOfCs(csId):null;
  const box=document.getElementById("view-menus");
  if(!csId){ box.innerHTML=`<h1>メニュー</h1><div class="card">この院には診療区分が登録されていません。</div>`; return; }
  const list=Store.menusOfCs(csId);

    const picked=inDb?Store.menuResources(m.id).map(r=>Number(r.id)):[];
    const chip=(r)=>`<label class="mn-chip ${picked.includes(Number(r.id))?'on':''}">
        <input type="checkbox" value="${r.id}" data-menu="${m.id}" ${picked.includes(Number(r.id))?'checked':''}
               ${inDb?'':'disabled'} onchange="menuResChanged(${m.id})">${esc(r.name)}</label>`;
    const ro=inDb?'':'disabled';
    return `<tr>
      <td><input class="mn-in" style="width:96%" value="${esc(m.name)}" ${ro} onchange="menuSet(${m.id},'name',this.value)"></td>
      <td><input class="mn-in" type="number" min="0" step="100" value="${m.price??''}" ${ro} onchange="menuSet(${m.id},'price',this.value)"> 円</td>
      <td><input class="mn-in" type="number" min="0" step="100" value="${m.firstVisitPrice??''}" ${ro} onchange="menuSet(${m.id},'firstVisitPrice',this.value)"> 円</td>
      <td><input class="mn-in" type="number" min="5" max="480" step="5" value="${m.durationMin??30}" ${ro} onchange="menuSet(${m.id},'durationMin',this.value)"> 分</td>
      <td><input class="mn-in" style="width:94%" value="${esc(m.staffType||'')}" ${ro} placeholder="例：看護師" onchange="menuSet(${m.id},'staffType',this.value)"></td>
      <td><div class="mn-chips">${devices.length?devices.map(chip).join(""):'<span class="muted">機材が未登録</span>'}</div></td>
      <td><div class="mn-chips">${staffs.length?staffs.map(chip).join(""):'<span class="muted">スタッフが未登録</span>'}</div></td>
      <td class="c">${inDb?`<button class="ghost-del" onclick="menuDelete(${m.id}, ${JSON.stringify(m.name)})">削除</button>`:''}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="muted">メニューがありません。</td></tr>`;

  box.innerHTML=`
    <h1>メニュー<span class="muted" style="font-size:15px;font-weight:400;margin-left:8px">${esc(clinic.name)}クリニック／${esc(svc?svc.name:'')}</span></h1>

async function menuImport(csId){
  const res=await Store.importDefaultMenus(csId);
  if(!res.ok) boardFail(res, res.error||"取り込めませんでした。"); else toast(`${res.count}件のメニューを登録しました。`);
  renderMenus();
}
async function menuSet(id, field, value){
  const patch={};
  if(field==="price"||field==="firstVisitPrice") patch[field]= value===""?null:Number(value);
  else if(field==="durationMin") patch[field]=Math.max(5,Math.min(480,Number(value)||30));
  else patch[field]=(value||"").trim();
  const res=await Store.updateMenu(id, patch);
  if(!res.ok){ boardFail(res,"保存できませんでした。"); renderMenus(); } else toast("保存しました。");
}
async function menuAdd(csId){
  const name=(document.getElementById('mnName').value||'').trim();
  if(!name){ document.getElementById('mnName').focus(); return; }
  const price=document.getElementById('mnPrice').value, dur=document.getElementById('mnDur').value;
  const res=await Store.addMenu(csId,{ name, price: price===""?null:Number(price), durationMin: Number(dur)||30 });
  if(!res.ok) boardFail(res,"追加できませんでした。"); else toast("メニューを追加しました。");
  renderMenus();
}
async function menuDelete(id,name){
  if(!confirm(`「${name}」を削除しますか？（過去の予約の表示には影響しません）`)) return;
  const res=await Store.removeMenu(id);
  if(!res.ok) boardFail(res,"削除できませんでした。"); else toast("削除しました。");
  renderMenus();
}
async function menuResChanged(menuId){
  const ids=[...document.querySelectorAll(`.mn-chips input[data-menu="${menuId}"]:checked`)].map(x=>Number(x.value));
  const res=await Store.setMenuResources(menuId, ids);
  if(!res.ok){ boardFail(res,"設定を保存できませんでした。"); }
  else toast(ids.length?`使う機材・担当を${ids.length}件に設定しました。`:"自動割当は院内の空きから選びます。");
  renderMenus();
}

/* ---------------- 予約一覧（全日・全ステータス） ---------------- */
let listFilter = "ALL";
let listQuery = "";                                   // 検索語（氏名・カナ・電話・予約番号）
function setListFilter(f){ listFilter = f; renderList(); }
/* 検索（UI調査 B-4）：受付の最頻タスク「電話が来た→名前で探す」を1操作で。
   入力のたびに全体を描き直すとカーソルが飛ぶため、表の中身だけ差し替える。 */
function setListQuery(v){
  listQuery = v;
  const body=document.getElementById('listBody');
  if(body){ body.innerHTML = listRowsHtml(); const c=document.getElementById('listCount'); if(c) c.textContent=listCount+"件"; }
  else renderList();
}
function listMatch(r, q){
  if(!q) return true;
  const norm = s => String(s||"").toLowerCase().replace(/[-\s]/g,"");
  const t = norm(q);
  return norm(r.name).includes(t) || norm(r.kana).includes(t) || norm(r.phone).includes(t) || norm(r.code).includes(t);
}
let listCount = 0;
const LIST_STATUS = { CONFIRMED:['予約確定','confirmed'], VISITED:['来院済','visited'], CANCELLED:['キャンセル','cancelled'], NO_SHOW:['不履行','no-show'] };
function listRowsHtml(){
  // 非患者ブロックは患者の予約一覧には出さない（台帳としてはタイムラインで見る）
  let all = Store.loadReservations()
    .filter(r=>inCurClinic(r.csId) && !Store.isBlock(r))
    .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  if(listFilter==="UNPAID") all = all.filter(r=>r.paymentStatus==="UNPAID"||r.paymentStatus==="PARTIAL");
  else if(listFilter!=="ALL") all = all.filter(r=>r.status===listFilter);
  all = all.filter(r=>listMatch(r, listQuery));
  listCount = all.length;
  const STATUS = LIST_STATUS;
  const rows = all.map(r=>{
    const c=Store.clinicOfCs(r.csId), svc=Store.serviceOfCs(r.csId), menu=r.menuId?Store.menuById(r.menuId):null;
    const st = STATUS[r.status]||[r.status,'confirmed'];
    const rm = r.status==="CONFIRMED" ? Store.roomName(r) : "", rmAlt = rm && roomAlt(r);
    return `<tr style="${r.status==='CANCELLED'?'opacity:.55':''}">
      <td class="t-num" style="white-space:nowrap">${Store.fmtJa(r.date)} ${r.time}</td>
      <td>${esc(c.name)}／${esc(svc.name)}${rm?` <span class="room-badge ${rmAlt?"r2":""}">${esc(rm)}</span>`:""}${menu?`<div class="muted" style="font-size:12px">${esc(menu.name)}</div>`:""}</td>
      <td><span class="pt-link ${r.status==='CANCELLED'?'struck':''}" onclick="openBooking('${esc(r.code)}')">${esc(r.name)} 様</span>${r.visitType==="FIRST"?'<span class="badge first" style="margin-left:4px">初診</span>':""}<div class="muted t-num" style="font-size:12px">${esc(r.phone)}</div></td>
      <td>${r.channel==="WEB"?'<span class="badge web">Web</span>':'<span class="badge phone">電話</span>'}</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td>
      <td>${payCell(r)}</td>
      <td>${r.status==="CONFIRMED"?`<button class="small secondary" onclick="markVisited('${esc(r.code)}')">来院</button> <button class="small danger" onclick="cancelRes('${esc(r.code)}')">取消</button>`:'<span class="muted" style="font-size:12px">—</span>'}</td>
    </tr>`;
  }).join("");
  return rows || `<tr><td colspan="7" style="text-align:center;color:var(--sub);padding:24px">${listQuery?'「'+esc(listQuery)+'」に一致する予約はありません。':'該当する予約はありません。'}</td></tr>`;
}
/* 会計セル：金額と支払状態を一覧でも見えるようにする（受付が「誰が未収か」を探せる） */
const PAY_LABEL = { UNPAID:['未収','pay-unpaid'], PAID:['支払済','pay-paid'], PARTIAL:['一部','pay-unpaid'], REFUNDED:['返金','pay-none'] };
function payCell(r){
  const amt = (r.amount!=null && r.amount!=="") ? '¥'+Number(r.amount).toLocaleString() : '';
  const p = PAY_LABEL[r.paymentStatus];
  if(!p && !amt) return '<span class="muted" style="font-size:12px">—</span>';
  return `${p?`<span class="badge ${p[1]}">${p[0]}</span>`:''}${amt?`<div class="t-num" style="font-size:12px;margin-top:2px">${amt}</div>`:''}`;
}
/* 未収の集計（この院・取消を除く） */
function unpaidSummary(){
  const rows = Store.loadReservations().filter(r=>inCurClinic(r.csId) && !Store.isBlock(r)
    && r.status!=="CANCELLED" && (r.paymentStatus==="UNPAID"||r.paymentStatus==="PARTIAL"));
  return { count: rows.length, total: rows.reduce((s,r)=>s+(Number(r.amount)||0),0) };
}
function renderList(){
  const chips = [['ALL','すべて'],['CONFIRMED','予約確定'],['VISITED','来院済'],['CANCELLED','キャンセル'],['UNPAID','未収のみ']]
    .map(([v,l])=>`<span class="chip ${listFilter===v?'active':''}" onclick="setListFilter('${v}')">${l}</span>`).join("");
  const body = listRowsHtml();
  const due = unpaidSummary();
  document.getElementById("view-list").innerHTML = `
    <h1>予約一覧<span class="muted" style="font-size:15px;font-weight:400;margin-left:8px">${esc(curClinicObj().name)}クリニック</span></h1>
    ${due.count?`<div class="banner-due">未収 <b>${due.count}件</b>／合計 <b>¥${due.total.toLocaleString()}</b>　<span class="muted" style="font-weight:400">「未収のみ」で絞り込めます。金額は予約詳細の「会計」で記録します。</span></div>`:""}
    <div class="list-tools">
      <input id="listSearch" class="list-search" type="search" placeholder="氏名・フリガナ・電話・予約番号で検索" value="${esc(listQuery)}" oninput="setListQuery(this.value)">
      <span class="hint">「/」キーで検索へ移動</span>
      <span class="hint" id="listCount">${listCount}件</span>
    </div>
    <div class="chips" style="margin-bottom:6px">${chips}</div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th style="width:120px">日時</th><th>クリニック／区分</th><th>患者</th><th style="width:60px">経路</th><th style="width:96px">状態</th><th style="width:110px">会計</th><th style="width:130px">操作</th></tr></thead>
      <tbody id="listBody">${body}</tbody></table>
    </div>`;
  const s=document.getElementById('listSearch');
  if(s && listQuery){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

function nfChanged(){ nf.time=null; nf.csId=Number(document.getElementById('nf_cs').value); nf.date=document.getElementById('nf_date').value; nfRefreshTimes(); }
function availTimes(csId, date){
  const days=Store.getDays(csId, 90); const d=days.find(x=>x.date===date);
  return d? d.slots.filter(s=>s.open && s.remaining>0) : [];
}
function nfRefreshTimes(){
  const times = availTimes(nf.csId, nf.date);
  const box=document.getElementById("nfTimes");
  if(!box) return;
  box.innerHTML = times.length ? times.map(s=>
    `<button type="button" class="time-chip ${nf.time===s.time?'selected':''}" onclick="nfPick('${s.time}')">${s.time}${s.remaining<=1?'<span class="rem">残1</span>':''}</button>`
  ).join("") : '<span class="muted">選択した日に空き枠がありません。別の日をお選びください。</span>';
}
function nfPick(t){ nf.time=t; nfRefreshTimes(); }
async function nfSubmit(){
  const err=(m)=>{ document.getElementById("nfErr").innerHTML=`<div class="alert">${esc(m)}</div>`; window.scrollTo(0,0); };
  const name=document.getElementById('nf_name').value.trim();
  const phone=document.getElementById('nf_phone').value.trim();
  const vt=(document.querySelector('input[name="nfvt"]:checked')||{}).value||"";
  if(!nf.time) return err("空き時間を選択してください。");
  if(!name||!phone) return err("お名前・電話番号は必須です。");
  if(!vt) return err("初診・再診を選択してください。");
  const btn=document.querySelector('#view-new .cta-bar button'); if(btn){btn.disabled=true;btn.textContent="登録中…";}
  const res=await Store.createReservation({
    csId:nf.csId, date:nf.date, time:nf.time, name, kana:document.getElementById('nf_kana').value.trim(),
    phone, birthDate:document.getElementById('nf_birth').value, visitType:vt, channel:"PHONE"
  });
  // ★保存に失敗したら予約として扱わない（入力内容は残したまま再試行できる状態に戻す）
  if(!res.ok){
    if(btn){btn.disabled=false;btn.textContent="この内容で予約する";}
    console.error("[受付ボード] 代理入力の予約に失敗:", res);
    nfRefreshTimes();                       // 最新の空き状況で時間ボタンを描き直す
    return err(boardMsg(res, "予約を登録できませんでした。"));
  }
  // 成功 → その日を日別ボードで表示
  curDate=nf.date; nf.time=null;
  document.getElementById("view-new").innerHTML=`<div class="success">予約を登録しました（予約番号 ${esc(res.reservation.code)}）。日別ボードに反映されています。</div>`;
  setTimeout(()=>showAdminTab('board'), 900);
}

/* ---------------- 予約枠の確認（読み取り専用） ---------------- */
let slotsCs = null;
function renderSlots(){
  if(curClinicObj().openingNote){ document.getElementById("view-slots").innerHTML = preparingCard("予約枠の確認"); return; }
  if(slotsCs==null || !inCurClinic(slotsCs)){ slotsCs=firstCsOfClinic(); }
  const days=Store.getDays(slotsCs, 14);
  // 行＝時刻／列＝日 のマトリクス（UI調査 B-5・E-4）。
  // 以前は「空き 2/2室」のチップが120個並び、情報量がほぼゼロだった。
  const times=[...new Set(days.reduce((a,d)=>a.concat(d.slots.map(s=>s.time)),[]))].sort();
  const cap=Store.capacityOfCs(slotsCs);
  const head=`<tr><th>時刻</th>${days.map(d=>`<th>${esc(d.label)}</th>`).join("")}</tr>`;
  const closedRow=`<tr><th>診療</th>${days.map(d=>d.closed
      ? `<td class="s-closed" title="${esc(d.closureReason||"診療日ではありません")}">休</td>`
      : `<td class="s-ok">○</td>`).join("")}</tr>`;
  const body=times.length ? times.map(t=>{
    const tds=days.map(d=>{
      const s=d.slots.find(x=>x.time===t);
      if(!s) return `<td class="s-closed">${d.closed?'休':'—'}</td>`;
      const cls=s.remaining===0?'s-full':(s.remaining<=1?'s-few':'s-ok');
      return `<td class="${cls}" title="${esc(d.label)} ${t}／空き ${s.remaining}／定員 ${s.capacity}">${s.remaining}</td>`;
    }).join("");
    return `<tr><th>${t}</th>${tds}</tr>`;
  }).join("") : "";
  const table = times.length
    ? `<div style="overflow:auto"><table class="slot-matrix">${head}${closedRow}${body}</table></div>`
    : `<div class="muted" style="padding:12px 0">今後2週間に診療日がありません（休診設定をご確認ください）。</div>`;
  document.getElementById("view-slots").innerHTML = `
    <h1>予約枠の確認<span class="muted" style="font-size:15px;font-weight:400;margin-left:8px">${esc(curClinicObj().name)}クリニック</span></h1>
    <p class="muted">診療時間マスタ（「診療時間・休診日」タブ）から自動生成された枠の空き状況です（今後2週間）。<b>数字＝その枠の空き（定員${cap}）</b>。<b>休</b>＝休診日。休憩・機材メンテのブロックも差し引かれています。</p>
    <div class="card">
      <label class="field" style="max-width:400px;margin-bottom:14px">クリニック／診療区分
        <select onchange="slotsCs=Number(this.value);renderSlots()">${csOptions(slotsCs)}</select>
      </label>
      ${table}
      <div class="slot-legend">
        <span><i class="s-ok" style="background:#eaf3ee"></i>空きあり</span>
        <span><i class="s-few" style="background:#fbf1dd"></i>残り1</span>
        <span><i class="s-full" style="background:#f1f3f6"></i>満／ブロック</span>
        <span><i class="s-closed" style="background:#eceff3"></i>休診・診療時間外</span>
      </div>
    </div>`;
}

      <p class="muted" style="font-size:12.5px;margin:4px 0 0">終了時刻ちょうどの枠は作りません（例 09:00〜12:00／30分刻み → 最終枠は11:30）。曜日の行が無い曜日は休診です。</p>
      <table class="hours-table"><thead><tr><th>曜日</th><th>診療時間</th><th>刻み</th><th></th></tr></thead><tbody>${trs}</tbody></table>
      <div class="hours-add">

        <div><label>開始</label><input id="hr_open_${s.id}" type="time" value="09:00" step="900"></div>
        <div><label>終了</label><input id="hr_close_${s.id}" type="time" value="12:00" step="900"></div>
        <div><label>刻み(分)</label><input id="hr_step_${s.id}" type="number" min="5" max="240" step="5" value="30" style="width:80px"></div>
        <button class="res-plus" onclick="hoursAdd(${s.id})">＋ 追加</button>
        ${useDb
          ? `<button class="quiet" style="margin-left:auto" onclick="hoursReset(${s.id})">既定に戻す（この区分の設定を全削除）</button>`
          : `<button class="secondary" style="margin-left:auto" onclick="hoursImport(${s.id})">既定を取り込んで編集する</button>`}
      </div>
    </div>`;
  }).join("");

  const today=Store.todayStr();
  const cl=Store.closuresOf(clinic.id).filter(c=>c.date>=Store.addDays(today,-30));
  const clRows=cl.map(c=>{
    const svc=c.csId?Store.serviceOfCs(c.csId):null;
    return `<div class="closure-row">
      <span class="cd">${esc(c.date)}（${WD_LABEL[Store.weekday(c.date)]}）</span>
      <span>${svc?esc(svc.name)+"のみ":"院全体"}</span>
      <span class="cr">${esc(c.reason||"臨時休診")}</span>
      <button class="small danger" onclick="closureDel(${c.id})">解除</button>
    </div>`;
  }).join("") || `<div class="muted" style="padding:8px 0">登録されている休診日はありません。</div>`;
  const svcOpts=`<option value="">院全体</option>`+clinic.services.map(s=>`<option value="${s.id}">${esc(s.name)}のみ</option>`).join("");

  document.getElementById("view-hours").innerHTML=`
    <h1>診療時間・休診日<span class="muted" style="font-size:15px;font-weight:400;margin-left:8px">${esc(clinic.name)}クリニック</span></h1>
    <p class="muted">ここで設定した診療時間・休診日が、<b>患者のWeb予約の空き枠</b>と受付の「予約枠の確認」にそのまま効きます。臨時休診にすれば、その日の枠は閉じて新規予約は入りません。</p>
    ${cards}
    <div class="hours-card">
      <h3>臨時休診</h3>
      <p class="muted" style="font-size:12.5px;margin:4px 0 10px">学会・設備点検・臨時の都合など、その日だけ閉じる設定です（定休はうえの曜日設定で表現します）。</p>
      <div class="hours-add" style="border-top:none;padding-top:0;margin-bottom:12px">
        <div><label>日付</label><input id="cl_date" type="date" value="${today}" min="${Store.addDays(today,-30)}"></div>
        <div><label>範囲</label><select id="cl_cs">${svcOpts}</select></div>
        <div style="flex:1;min-width:180px"><label>理由（任意）</label><input id="cl_reason" placeholder="例）設備点検" style="width:100%"></div>
        <button class="res-plus" onclick="closureAdd()">＋ 休診にする</button>
      </div>
      ${clRows}
    </div>`;
}
async function hoursAdd(csId){
  const g=id=>document.getElementById(id);
  const res=await Store.addHours(csId, Number(g('hr_wd_'+csId).value), g('hr_open_'+csId).value, g('hr_close_'+csId).value, Number(g('hr_step_'+csId).value));
  if(!res.ok) boardFail(res, "診療時間を保存できませんでした。"); else toast("診療時間を追加しました。");
  renderHours();
}
async function hoursDel(id){
  const res=await Store.removeHours(id);
  if(!res.ok) boardFail(res, "診療時間を削除できませんでした。"); else toast("診療時間を削除しました。");
  renderHours();
}
async function hoursImport(csId){
  const res=await Store.importDefaultHours(csId);
  if(!res.ok) boardFail(res, "取り込めませんでした。"); else toast("既定の診療時間を取り込みました。ここから編集できます。");
  renderHours();
}
async function hoursReset(csId){
  if(!confirm("この診療区分の診療時間の設定をすべて削除し、既定（コード内の診療時間）に戻します。よろしいですか？")) return;
  const res=await Store.resetHours(csId);
  if(!res.ok) boardFail(res, "初期化できませんでした。"); else toast("既定に戻しました。");
  renderHours();
}
async function closureAdd(){
  const d=document.getElementById('cl_date').value, cs=document.getElementById('cl_cs').value, rs=document.getElementById('cl_reason').value;
  const res=await Store.addClosure(curClinic, cs?Number(cs):null, d, rs);
  if(!res.ok) boardFail(res, "休診日を登録できませんでした。"); else toast("休診に設定しました（この日の空き枠は閉じます）。");
  renderHours();
}
async function closureDel(id){
  const res=await Store.removeClosure(id);
  if(!res.ok) boardFail(res, "解除できませんでした。"); else toast("休診を解除しました。");
  renderHours();
}

/* ---------------- 準備中プレースホルダ ---------------- */
const PLACE = {
  menus: ['美容メニュー', '公式サイト（WordPress）から施術メニューを同期し、所要時間・料金・受付ON/OFFを管理する画面です。現在のプロトタイプではメニューは固定データで表示しています。'],
  staff: ['スタッフ', '医師・看護師・スタッフを登録し、予約への担当割当（同時刻ダブルアサイン防止）を行う画面です。'],
  import: ['CSV取り込み', '他システムや紙台帳からの予約・患者データをCSVで一括取り込みする画面です。'],
};
function renderPlaceholder(id){
  const [title, desc] = PLACE[id];
  document.getElementById("view-"+id).innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="card placeholder-box">
      <div class="pi">この画面は準備中です</div>
      <div>${esc(desc)}</div>
      <div class="avail">現在ご利用いただける画面：
        <div class="avail-list">
          <a onclick="showAdminTab('board')">日別ボード</a>
          <a onclick="showAdminTab('list')">予約一覧</a>
          <a onclick="showAdminTab('new')">電話予約の代理入力</a>
          <a onclick="showAdminTab('slots')">予約枠の確認</a>
        </div>
      </div>
    </div>`;
}

/* ---------------- 同期受信 ---------------- */
Store.onSync((msg)=>{
  const now = currentCodes();
  const flash = new Set([...now].filter(c=>!prevCodes.has(c)));
  prevCodes = now;
  if(msg && msg.at && msg.type==="reservation"){
    const ms = (msg.latency!=null) ? msg.latency : (Date.now() - msg.at);
    const el=document.getElementById("latency"); if(el) el.innerHTML = `⚡ 最終同期 <b>${ms}ms</b>（サブ秒）`;
  }
  // 表示中タブを再描画（ボードはフラッシュ付き）
  if(curTab==="board") renderBoard(flash);
  else if(curTab==="new") nfRefreshTimes();   // 代理入力中は入力内容を消さない。空き時間だけ更新する
  else renderTab(curTab);
});

/* ---------------- キーボード操作（UI調査 B-10 / B-4） ----------------
   Esc … モーダルを閉じる／ドラッグ中なら中断（元の位置へ戻す）
   /   … 予約一覧の検索へフォーカス */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    if(_tlDrag){                                   // ドラッグ中は移動をやめる
      const d=_tlDrag; _tlDrag=null; hideDropGuide();
      document.removeEventListener('mousemove', tlDragMove);
      document.removeEventListener('mouseup', tlDragEnd);
      if(d && d.blk){ d.blk.classList.remove('dragging'); d.blk.style.opacity=''; d.blk.style.zIndex=''; }
      renderTimeline();
      return;
    }
    const m=document.getElementById('bkModal');
    if(m && m.style.display!=='none') closeBooking();
    return;
  }
  if(e.key === '/' && curTab === 'list'){
    const t=e.target && e.target.tagName;
    if(t==='INPUT' || t==='TEXTAREA' || t==='SELECT') return;
    const s=document.getElementById('listSearch');
    if(s){ e.preventDefault(); s.focus(); s.select(); }
  }
});

/* ---------------- 起動 ---------------- */
renderClinicSwitch();
renderBoard();
Store.ready.then(()=>{
  prevCodes = currentCodes();
  const b = Store.getBackend();
  const brand = document.querySelector(".admin-header .brand small");
  if(brand) brand.textContent = b==="supabase" ? "Supabase リアルタイム同期"
                              : b==="offline"  ? "⚠ 予約DBに未接続（保存されません）"
                              : "リアルタイム同期（ローカル）";
  const lat=document.getElementById("latency");
  if(lat && b==="offline"){ lat.textContent="接続エラー"; lat.style.color="#fca5a5"; }
  renderConnBar();
  renderTab(curTab);
  loadDayNote();
});
</script>
