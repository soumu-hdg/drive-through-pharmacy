<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>EC売上ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
:root {
  --bg: #f5f7fa; --card: #fff; --text: #333; --sub: #888; --border: #e5e7eb;
  --shopify: #96bf48; --employee: #f59e0b; --wholesale: #6366f1;
  --amazon: #ff9900; --qoo10: #e31937; --rakuten: #bf0000; --accent: #667eea; --accent2: #764ba2;
  --green: #4ade80; --red: #f87171; --blue: #60a5fa; --purple: #a78bfa;
  --font: 'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:16px}

.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:24px 30px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:24px;margin-bottom:4px}
.header .ts{opacity:.8;font-size:13px}

.date-filter{background:var(--card);border-radius:10px;padding:14px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.date-filter label{font-weight:600;color:#666;font-size:13px}
.date-filter input[type="date"]{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;color:var(--text)}
.date-filter input:focus{outline:none;border-color:var(--accent)}
.filter-btn{padding:8px 18px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.filter-btn:hover{opacity:.9}
.reset-btn{padding:8px 14px;background:#f3f4f6;color:#666;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer}
.date-range-info{font-size:12px;color:var(--sub);margin-left:auto}

.tab-nav{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:#999;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}

.grid{display:grid;gap:16px;margin-bottom:16px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-1{grid-template-columns:1fr}

.card{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:14px;color:#666;margin-bottom:10px;font-weight:600}
.card h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.metric{font-size:28px;font-weight:700;color:var(--accent)}
.metric-sub{font-size:12px;color:var(--sub);margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px;color:#666;font-weight:600;font-size:11px;border-bottom:2px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#f8f9fb}
.num{text-align:right;font-variant-numeric:tabular-nums}

.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff}
.badge-shopify{background:var(--shopify)}.badge-employee{background:var(--employee)}
.badge-wholesale{background:var(--wholesale)}.badge-amazon{background:var(--amazon)}
.badge-qoo10{background:var(--qoo10)}.badge-rakuten{background:var(--rakuten)}.badge-ok{background:rgba(74,222,128,.15);color:#16a34a}
.badge-ng{background:rgba(248,113,113,.15);color:#dc2626}
.badge-info{background:rgba(96,165,250,.15);color:#2563eb;font-size:10px;padding:2px 8px;border-radius:10px}

.chart-box{position:relative;height:280px}
.alert-row{background:rgba(248,113,113,.06)}

/* Funnel */
.funnel{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 0;flex-wrap:wrap}
.funnel-step{text-align:center;flex:1;min-width:120px;max-width:160px;padding:16px 10px;border-radius:10px}
.funnel-step .fs-title{font-size:11px;font-weight:700;margin-bottom:6px}
.funnel-step .fs-val{font-size:24px;font-weight:700}
.funnel-step .fs-rate{font-size:11px;color:var(--sub);margin-top:4px}
.funnel-arrow{font-size:22px;color:#ccc}

/* Report */
.report-preview{background:#1e1e1e;color:#d4d4d4;border-radius:8px;padding:16px;font-family:'Cascadia Code',monospace;font-size:12px;white-space:pre-wrap;max-height:500px;overflow-y:auto;line-height:1.7}
.copy-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.copy-btn:hover{opacity:.9}

/* SNS sub tabs */
.sns-sub-tabs{display:flex;gap:8px;margin-bottom:16px}
.sns-sub-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:#666;font-size:12px;font-weight:600;cursor:pointer}
.sns-sub-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

@media(max-width:768px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .funnel{flex-direction:column}.funnel-arrow{transform:rotate(90deg)}
  body{padding:8px}
}
</style>
</head>
<body>

<div class="header">
  <div><h1>EC売上ダッシュボード</h1><div class="ts" id="syncTs">読み込み中...</div></div>
  <div style="display:flex;align-items:center;gap:10px">
    <button id="syncBtn" onclick="runSync()" style="padding:10px 20px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,.35)'" onmouseout="this.style.background='rgba(255,255,255,.2)'">&#x21bb; 集計更新</button>
  </div>
</div>
<div id="syncResult" style="display:none;margin-bottom:16px;border-radius:10px;padding:14px 20px;font-size:13px;line-height:1.8"></div>

<div class="date-filter">
  <label>開始日:</label><input type="date" id="startDate">
  <label>終了日:</label><input type="date" id="endDate">
  <button class="filter-btn" onclick="applyFilter()">適用</button>
  <button class="reset-btn" onclick="resetFilter()">リセット</button>
  <div class="date-range-info" id="dateRangeInfo">-</div>
</div>

<div class="tab-nav" id="tabNav">
  <button class="tab-btn active" onclick="showTab('dashboard')">ダッシュボード</button>
  <button class="tab-btn" onclick="showTab('charts')">グラフ分析</button>
  <button class="tab-btn" onclick="showTab('product')">商品別詳細</button>
  <button class="tab-btn" onclick="showTab('analytics')">アナリティクス</button>
  <button class="tab-btn" onclick="showTab('report')">売上報告</button>
  <button class="tab-btn" onclick="showTab('profit')">利益比較</button>
  <button class="tab-btn" onclick="showTab('kpi')">KPIレポート</button>
  <button class="tab-btn" onclick="showTab('inventory')">在庫状況</button>
  <button class="tab-btn" onclick="showTab('sns')">SNS分析</button>
  <button class="tab-btn" onclick="showTab('seo')">SEO分析</button>
  <button class="tab-btn" onclick="showTab('channel')">媒体別分析</button>
  <button class="tab-btn" onclick="showTab('compare')">媒体比較</button>
  <button class="tab-btn" onclick="showTab('history')">最新履歴</button>
  <button class="tab-btn" onclick="showTab('sync')">同期管理</button>
</div>

<div class="tab-content" id="tab-charts"></div>
<div class="tab-content" id="tab-product"></div>
<div class="tab-content" id="tab-analytics"></div>
<div class="tab-content" id="tab-report"></div>
<div class="tab-content" id="tab-profit"></div>
<div class="tab-content" id="tab-kpi"></div>
<div class="tab-content" id="tab-inventory"></div>
<div class="tab-content" id="tab-sns"></div>
<div class="tab-content" id="tab-seo"></div>
<div class="tab-content" id="tab-channel"></div>
<div class="tab-content" id="tab-compare"></div>
<div class="tab-content" id="tab-history"></div>

<script>
const SB='https://vypwgxkqtxuzqfaaeamf.supabase.co',SK='sb_publishable_WVbE1jJE6sBDli7qO-xSJA_GqDqu4OE',H={'apikey':SK};
let D=[],O=[],G=[],S=[],I=[],SY=[],SEO=[],SEO_ART=[],SEO_QRY=[];
let dS=null,dE=null,charts={};

// ===== 転送量の自己計測（2026-08-07 Phase1 Task1.3）=====
// どのクエリが何バイト転送したかを画面で見えるようにする。推測でEgressを語らないため。
let _bytes=0,_calls=0;
async function sbGet(t,q='',maxRows=0){
  if(maxRows<=1000){
    const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{headers:H,cache:'no-store'});
    if(!r.ok)throw new Error(`${t}: HTTP ${r.status}`);
    const txt=await r.text();_bytes+=txt.length;_calls++;return JSON.parse(txt);
  }
  let all=[],from=0;const pgSize=1000;
  while(from<maxRows){
    const hdrs={...H,'Range':from+'-'+(from+pgSize-1)};
    const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{headers:hdrs,cache:'no-store'});
    if(!r.ok&&r.status!==206)throw new Error(`${t}: HTTP ${r.status}`);
    const txt=await r.text();_bytes+=txt.length;_calls++;
    const d=JSON.parse(txt);all=all.concat(d);if(d.length<pgSize)break;from+=pgSize;
  }
  return all;
}

// ===== 取得する列を明示する（select=* をやめる）=====
// 未使用の列（id / created_at / site_name / bounce_rate 等）まで毎回運んでいたのを止める。
const Q={
  // 旧 kpi_daily_summary は「手動の集計更新ボタンでしか更新されない」構造で 2026-07-29 から
  // 停滞していた。DB内で kpi_orders から再計算される v_kpi_dash_daily に切替える。
  // これにより概要タブの数字が商品/売上報告/利益タブ（kpi_orders基準）と一致する。
  daily:   ['v_kpi_dash_daily','select=date,channel,order_count,revenue,discount&order=date.desc&limit=2000',2000],
  orders:  ['kpi_orders','select=order_id,channel,order_date,order_datetime,product_name,sku,quantity,total,discount,is_subscription,subscription_count,prefecture&order=order_date.desc&limit=5000',5000],
  ga4:     ['kpi_ga4_metrics','select=date,metric_type,dimension,sessions,users,pageviews,conversions,revenue&order=date.desc&limit=500',0],
  sns:     ['kpi_sns_metrics','select=date,platform,followers,posts,likes,comments,shares,impressions,reach,extra_json&order=date.desc&limit=300',0],
  inv:     ['kpi_inventory','select=snapshot_date,sku,product_name,quantity,threshold,is_alert&order=snapshot_date.desc&limit=500',0],
  seo:     ['kpi_seo_daily','select=date,site_key,active_users,sessions,clicks,impressions,ctr,position,created_at&order=date.asc&limit=5000',5000],
  // SEOタブを開いたときだけ取得する（合計1.4MBあり、初期表示には不要）
  seoArt:  ['kpi_seo_articles','select=site_key,url,slug,title,clicks,impressions,ctr,position,period_start,period_end&order=clicks.desc&limit=3000',3000],
  seoQry:  ['kpi_seo_queries','select=site_key,query,clicks,impressions,ctr,position,period_start,period_end&order=clicks.desc&limit=3000',3000],
  excl:    ['kpi_excluded_orders','select=order_id',0],
  sync:    ['kpi_sync_status','select=sync_type,last_sync,record_count,status',0],
  fresh:   ['kpi_freshness','select=source,last_success,last_attempt,last_status,last_rows,stale_after_minutes',0],
  // 同期管理タブ用（このタブを開いた時だけ取得。合計でも数十KB）
  cfg:     ['kpi_source_config','select=source,schedule,enabled,mode,notes,updated_at&order=source',0],
  usage:   ['kpi_usage_monthly','select=month,budget_bytes,used_bytes_out,api_calls,backoff_level,updated_at&order=month.desc&limit=3',0],
  joblog:  ['kpi_job_log','select=started_at,finished_at,job,status,rows_written,bytes_out,api_calls,duration_ms,error_msg&order=started_at.desc&limit=40',0],
};
let FR=[];   // kpi_freshness（鮮度ストリップ用）。SY は従来どおり kpi_sync_status（最新履歴タブが参照）
const sbQ=k=>sbGet(Q[k][0],Q[k][1],Q[k][2]);
function fmt(n){return n!=null?Number(n).toLocaleString('ja-JP'):'-'}
function yen(n){return n!=null?'¥'+Number(n).toLocaleString('ja-JP'):'-'}
function pct(a,b){return b>0?((a/b)*100).toFixed(1)+'%':'-'}
function chBadge(ch){const m={shopify:'badge-shopify',employee:'badge-employee',wholesale:'badge-wholesale',amazon:'badge-amazon',amazon_fba:'badge-amazon',qoo10:'badge-qoo10',rakuten:'badge-rakuten'};return `<span class="badge ${m[ch]||'badge-info'}">${chName(ch)}</span>`}
function chName(ch){return{shopify:'Shopify',employee:'社割',wholesale:'卸売',amazon:'Amazon',amazon_fba:'Amazon(FBA)',qoo10:'Qoo10',rakuten:'楽天'}[ch]||ch}
function normProd(n){
  if(!n)return'不明';
  n=n.replace(/\s*\(Shopify\)|\s*\(卸売\)|\s*\(社割\)/g,'').trim();
  const map=[
    [/わき用クリーム/,'わき用クリーム'],
    [/スキンセラム|美容液セット/,'スキンセラム'],
    [/スキンローション|化粧水/,'スキンローション'],
    [/メンズスキンセラム|メンズ.*美容液/,'メンズスキンセラム'],
    [/メンズスキンローション|メンズ.*化粧水/,'メンズスキンローション'],
    [/スキンケアセット/,'スキンケアセット'],
    [/トライアルセット/,'トライアルセット'],
    [/デオドラントクリーム|制汗クリーム|制汗剤/,'わき用クリーム'],
  ];
  for(const[re,short]of map){if(re.test(n))return short}
  return n;
}

function showTab(id){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',b.textContent.includes(
    {dashboard:'ダッシュボード',charts:'グラフ',product:'商品',analytics:'アナリティクス',report:'売上報告',profit:'利益',kpi:'KPI',inventory:'在庫',sns:'SNS',seo:'SEO',channel:'媒体別分析',compare:'媒体比較',history:'最新履歴',sync:'同期管理'}[id]||''
  )));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  // SEO記事別・検索クエリ別（合計約1.4MB）は、SEOタブを開いたときに初めて取得する。
  // 概要しか見ない大多数のロードで運ばなくて済む。
  if(id==='seo'&&!_seoLoaded){
    const host=document.getElementById('tab-seo');
    if(host&&!document.getElementById('seoLoading')){
      const n=document.createElement('div');n.id='seoLoading';
      n.style.cssText='padding:10px 14px;margin:8px 0;background:#e9f1ee;border-left:4px solid #0e7c66;font-size:13px;color:#0b5344';
      n.textContent='SEO記事別・検索クエリ別データを読み込み中…';
      host.insertBefore(n,host.firstChild);
    }
    loadSeoDetail().then(()=>{
      const n=document.getElementById('seoLoading');if(n)n.remove();
      renderSEO(filt(SEO),SEO_ART,SEO_QRY);
    }).catch(()=>{const n=document.getElementById('seoLoading');if(n)n.remove();});
  }
  // 同期管理タブも開いたときに取得する（設定・使用量・ジョブログ・鮮度で数十KB）
  if(id==='sync'){
    const host=document.getElementById('tab-sync');
    if(host&&!_syncLoaded)host.innerHTML='<div style="padding:14px;color:#0b5344">同期状況を読み込み中…</div>';
    loadSync().then(renderSync).catch(e=>showError('同期管理の読み込みに失敗しました → '+e.message));
  }
}

function filt(arr,df='date'){return arr.filter(d=>{const v=d[df];if(!v)return false;if(dS&&v<dS)return false;if(dE&&v>dE)return false;return true})}
function applyFilter(){dS=document.getElementById('startDate').value||null;dE=document.getElementById('endDate').value||null;renderAll()}
function resetFilter(){dS=null;dE=null;const ds=D.map(d=>d.date).sort();if(ds.length){document.getElementById('startDate').value=ds[0];document.getElementById('endDate').value=ds[ds.length-1]}renderAll()}
function destroyC(id){if(charts[id]){charts[id].destroy();delete charts[id]}}

// ===== エラーバナー（2026-08-07）=====
// これまで取得失敗は console.log か .catch(()=>[]) で握りつぶされ、画面上は
// 「データが無い」ようにしか見えなかった。何がどう失敗したかを必ず画面に出す。
function showError(msg){
  let el=document.getElementById('kpiErrBanner');
  if(!el){
    el=document.createElement('div');el.id='kpiErrBanner';
    el.style.cssText='background:#fbf1ec;border:1px solid #b5502f;border-left:5px solid #b5502f;color:#8f3d22;padding:10px 14px;margin:10px 0;border-radius:4px;font-size:13px;line-height:1.6';
    const host=document.getElementById('syncTs');
    if(host&&host.parentNode)host.parentNode.insertBefore(el,host.nextSibling);
    else document.body.insertBefore(el,document.body.firstChild);
  }
  el.innerHTML='<b>⚠ データ取得エラー</b><br>'+msg+
    '<br><span style="font-size:11px;color:#a06a55">この表示が出ている間、画面の数字は最新ではありません。</span>';
  el.style.display='';
}
function clearError(){const el=document.getElementById('kpiErrBanner');if(el)el.style.display='none'}

// ===== データ鮮度ストリップ（2026-08-07）=====
// どのデータがいつ時点かを常に見せる。stale_after を超えたソースは琥珀で警告。
const FRESH_LABEL={ec_orders:'EC注文',ga4:'GA4',search_console:'Search Console',
  seo_articles:'SEO記事',seo_queries:'SEO クエリ',sns:'SNS',inventory:'在庫',daily_summary:'日次集計'};
function renderFreshness(rows){
  const host=document.getElementById('syncTs');if(!host)return;
  let el=document.getElementById('kpiFresh');
  if(!el){el=document.createElement('div');el.id='kpiFresh';
    el.style.cssText='display:flex;flex-wrap:wrap;gap:0;border:1px solid #e2ddd2;background:#fff;margin:8px 0;border-radius:4px;overflow:hidden';
    host.parentNode.insertBefore(el,host.nextSibling);}
  const now=Date.now();
  el.innerHTML='<div style="padding:6px 12px;font-size:10px;font-weight:700;color:#8a8578;letter-spacing:.08em;border-right:1px solid #e2ddd2;display:flex;align-items:center">データ鮮度</div>'+
    (rows||[]).map(r=>{
      const t=r.last_success?new Date(r.last_success).getTime():null;
      const mins=t?Math.floor((now-t)/60000):null;
      const stale=(mins===null)||(mins>(r.stale_after_minutes||1440));
      const ago=mins===null?'未実行':(mins<60?mins+'分前':(mins<1440?Math.floor(mins/60)+'時間前':Math.floor(mins/1440)+'日前'));
      return `<div style="padding:6px 12px;border-right:1px solid #e2ddd2;${stale?'background:#f6ecda':''}">
        <div style="font-size:10px;color:#8a8578;font-weight:700">${FRESH_LABEL[r.source]||r.source}</div>
        <div style="font-size:12px;font-weight:800;color:${stale?'#c9821f':'#0e7c66'}">${ago}${stale?' ⚠':''}</div></div>`;
    }).join('');
}

// ===== 共通のデータ取得 =====
// 初期表示に不要な SEO記事/SEOクエリ（合計約1.4MB）は、SEOタブを開いたときに取得する。
let _seoLoaded=false;
function applyOrderFilters(EX){
  const exSet=new Set(EX.map(e=>e.order_id));
  if(exSet.size){const b=O.length;O=O.filter(o=>!exSet.has(o.order_id));if(b-O.length)console.log(`[除外]${b-O.length}件の社員テスト購入を除外`)}
  // order_id+channel+skuで重複除去（完全一致行のみ除去、商品別明細は維持）
  O=(()=>{const seen=new Set();return O.filter(o=>{const k=o.order_id+"|"+o.channel+"|"+(o.sku||o.product_name||"");if(seen.has(k))return false;seen.add(k);return true})})();
  // 数値ID×#名前の二重登録を除去（同一 channel+order_datetime+sku+total で #名前があれば数値IDを捨てる。Shopify二重計上対策）

let curChannel='shopify';

// 媒体ごとに固定の疑似乱数（開き直しても同じ数字＝はりぼてでも比較して議論できる）
function chRnd(key){
  let h=2166136261;
  for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)}
  return function(){h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%100000)/100000}
}
function sampleBox(inner){
  return `<span style="display:inline-block;background:repeating-linear-gradient(45deg,#fff7e6,#fff7e6 6px,#fdf0d5 6px,#fdf0d5 12px);border:1px dashed #d9a441;border-radius:4px;padding:0 6px">${inner}</span>`;
}

function chDaysArr(o,ch,days){
  const end=new Date(); const map={};
  o.filter(x=>x.channel===ch).forEach(x=>{ map[x.order_date]=(map[x.order_date]||0)+Number(x.total||0) });
  const out=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(end); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    out.push({date:k, v:map[k]||0});
  }
  return out;
}

  const s30=dayStr(29), s60=dayStr(59), s90=dayStr(89);

  const cur={},prev={},curN={},prevN={};
  keys.forEach(k=>{
    const c=o.filter(x=>x.channel===k&&x.order_date>=s30);
    const p=o.filter(x=>x.channel===k&&x.order_date>=s60&&x.order_date<s30);
    cur[k]=sumT(c); prev[k]=sumT(p); curN[k]=uniq(c); prevN[k]=uniq(p);

  const totalCur=keys.reduce((s,k)=>s+cur[k],0), totalPrev=keys.reduce((s,k)=>s+prev[k],0);

  // 月次（13ヶ月）
  const months=[...new Set(o.map(x=>(x.order_date||'').slice(0,7)).filter(Boolean))].sort().slice(-13);
  const byMonth={}; keys.forEach(k=>byMonth[k]=months.map(m=>sumT(o.filter(x=>x.channel===k&&(x.order_date||'').startsWith(m)))));

  // 日次90日（7日移動平均）
  const days=[]; for(let i=89;i>=0;i--)days.push(dayStr(i));
  const byDay={}; keys.forEach(k=>{
    const map={}; o.filter(x=>x.channel===k).forEach(x=>{map[x.order_date]=(map[x.order_date]||0)+Number(x.total||0)});
    const raw=days.map(d=>map[d]||0);

  // 日次30日 積み上げ

  // 曜日×媒体

  const up=v=>v>=0?'var(--green)':'var(--red)';

  let h='';

  // ===== 凡例（全グラフ共通の色） =====
  h+=`<div class="card" style="margin-bottom:16px">

  h+=`<div class="grid grid-4">
    <div class="card"><h2>全媒体 合計売上（30日）</h2><div class="metric">${yen(Math.round(totalCur))}</div>
      <div class="metric-sub">前30日比 <b style="color:${up(mom)}">${arr(mom)} ${(mom*100).toFixed(1)}%</b></div></div>
    <div class="card"><h2>最大の媒体</h2><div class="metric" style="color:${col(top)}">${nm(top)}</div>
      <div class="metric-sub">${yen(Math.round(cur[top]))}（構成比 ${totalCur?(cur[top]/totalCur*100).toFixed(1):0}%）</div></div>
    <div class="card"><h2>もっとも伸びた媒体</h2><div class="metric" style="color:${col(best&&best.k)}">${best?nm(best.k):'—'}</div>

    <div class="card"><h2>もっとも落ちた媒体</h2><div class="metric" style="color:${col(worst&&worst.k)}">${worst?nm(worst.k):'—'}</div>
      <div class="metric-sub">${worst?`前30日比 <b style="color:var(--red)">▼ ${(worst.g*100).toFixed(1)}%</b>`:''}</div></div>
  </div>`;

  // ===== 積み上げ棒 ＋ ドーナツ =====
  h+=`<div class="grid grid-2">
    <div class="card"><h2>日次売上の内訳（30日・積み上げ）— 全体の山と、その中身が同時に見えます</h2>
      <div class="chart-box" style="height:300px"><canvas id="cCmpStack"></canvas></div></div>

      <div class="chart-box" style="height:300px"><canvas id="cCmpDonut"></canvas></div></div>
  </div>`;

  // ===== 月次積み上げ ＋ 構成比推移 =====
  h+=`<div class="grid grid-2">
    <div class="card"><h2>月次売上の推移（${months.length}ヶ月・積み上げ）</h2>
      <div class="chart-box" style="height:300px"><canvas id="cCmpMonth"></canvas></div>
      <div style="font-size:11px;color:#b45309;margin-top:6px">※ 右端の ${months[months.length-1]} は<b>まだ月の途中</b>です。前月までと同じ高さで比べないでください。</div></div>
    <div class="card"><h2>構成比の推移（月次・100%積み上げ）— どの媒体のシェアが伸びたか</h2>
      <div class="chart-box" style="height:300px"><canvas id="cCmpShare"></canvas></div>
      <div style="font-size:11px;color:#b45309;margin-top:6px">※ 右端の ${months[months.length-1]} は月の途中のため、まだ数日分の偏りが強く出ます。</div></div>
  </div>`;

  // ===== 重ね折れ線 ＋ バブル =====
  h+=`<div class="grid grid-2">
    <div class="card"><h2>媒体別の勢い（90日・7日移動平均を重ねて比較）</h2>
      <div class="chart-box" style="height:300px"><canvas id="cCmpLines"></canvas></div></div>
    <div class="card"><h2>ポジショニング（横=注文数 / 縦=客単価 / 円の大きさ=売上）</h2>

  // ===== 成長率 横棒 =====
  h+=`<div class="grid grid-2">

  // ===== 描画 =====
  ['cCmpStack','cCmpDonut','cCmpMonth','cCmpShare','cCmpLines','cCmpBubble','cCmpGrowth'].forEach(destroyC);
  const base={responsive:true,maintainAspectRatio:false,plugins:{datalabels:{display:false},legend:{position:'bottom',labels:{font:{size:10},boxWidth:12,padding:8}}}};
  const yenTick={ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}};

  // 日次積み上げ
  charts.cCmpStack=new Chart(document.getElementById('cCmpStack'),{type:'bar',

  // ドーナツ
  charts.cCmpDonut=new Chart(document.getElementById('cCmpDonut'),{type:'doughnut',

      formatter:(v)=>totalCur&&v/totalCur>0.04?((v/totalCur)*100).toFixed(0)+'%':''}}}});

  // 月次積み上げ
  charts.cCmpMonth=new Chart(document.getElementById('cCmpMonth'),{type:'bar',
    data:{labels:months,datasets:keys.map(k=>({label:nm(k),data:byMonth[k],backgroundColor:col(k)}))},
    options:{...base,scales:{x:{stacked:true,ticks:{font:{size:9}}},y:{stacked:true,beginAtZero:true,...yenTick}}}});

  // 構成比推移（100%積み上げ）
  const monthTotals=months.map((_,i)=>keys.reduce((s,k)=>s+byMonth[k][i],0));
  charts.cCmpShare=new Chart(document.getElementById('cCmpShare'),{type:'bar',
    data:{labels:months,datasets:keys.map(k=>({label:nm(k),
      data:byMonth[k].map((v,i)=>monthTotals[i]?v/monthTotals[i]*100:0),backgroundColor:col(k)}))},
    options:{...base,scales:{x:{stacked:true,ticks:{font:{size:9}}},
      y:{stacked:true,beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});

  // 重ね折れ線
  charts.cCmpLines=new Chart(document.getElementById('cCmpLines'),{type:'line',
    data:{labels:days.map(d=>d.slice(5)),datasets:keys.map(k=>({label:nm(k),data:byDay[k],
      borderColor:col(k),backgroundColor:col(k),borderWidth:2,pointRadius:0,tension:.3}))},
    options:{...base,scales:{x:{ticks:{maxTicksLimit:12,font:{size:9}}},y:{beginAtZero:true,...yenTick}}}});

  // バブル
  const maxRev=Math.max(...keys.map(k=>cur[k]),1);
  charts.cCmpBubble=new Chart(document.getElementById('cCmpBubble'),{type:'bubble',
    data:{datasets:keys.filter(k=>curN[k]>0).map(k=>({label:nm(k),backgroundColor:col(k)+'cc',borderColor:col(k),
      data:[{x:curN[k],y:Math.round(cur[k]/curN[k]),r:8+26*Math.sqrt(cur[k]/maxRev)}]}))},
    options:{...base,plugins:{...base.plugins,tooltip:{callbacks:{label:c=>
      `${c.dataset.label}: 注文${fmt(c.raw.x)}件 / AOV ${yen(c.raw.y)}`}}},
      layout:{padding:{right:24,top:16}},
      scales:{x:{title:{display:true,text:'注文数（30日）',font:{size:10}},beginAtZero:true,
                 suggestedMax:Math.max(...keys.map(k=>curN[k]))*1.18},
              y:{title:{display:true,text:'客単価 AOV',font:{size:10}},beginAtZero:true,
                 suggestedMax:Math.max(...keys.filter(k=>curN[k]>0).map(k=>cur[k]/curN[k]))*1.25,...yenTick}}}});

  // 成長率
  const gs=keys.map(k=>({k,g:prev[k]>0?cur[k]/prev[k]-1:null})).filter(x=>x.g!==null).sort((a,b)=>b.g-a.g);
  charts.cCmpGrowth=new Chart(document.getElementById('cCmpGrowth'),{type:'bar',

      datalabels:{display:true,anchor:'end',align:(c)=>c.dataset.data[c.dataIndex]>=0?'right':'left',

  // 曜日×媒体 ヒートマップ（CSS）
  const maxDow=Math.max(...keys.map(k=>Math.max(...dow[k])),1);
  let ht='<table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="text-align:left">媒体</th>'+
    dowName.map(d=>`<th class="num" style="text-align:center">${d}</th>`).join('')+'<th class="num">最も強い曜日</th></tr>';
  keys.forEach(k=>{
    const mx=Math.max(...dow[k]);
    const bestD=dow[k].indexOf(mx);
    ht+=`<tr><td><span class="badge" style="background:${col(k)}">${nm(k)}</span></td>`+
      dow[k].map(v=>{

      }).join('')+
      `<td class="num" style="font-weight:700;color:${col(k)}">${mx?dowName[bestD]+'曜':'—'}</td></tr>`;

  document.getElementById('cmpHeat').innerHTML=ht;
}

const LOCAL_SYNC='http://127.0.0.1:3457';

  sns:'SNS（IG/TikTok/LINE/Threads）',inventory:'在庫（スプレッドシート）',
  rakuten_api:'楽天RMS 受注API',amazon_spapi:'Amazon SP-API'};
let CFG=[],USAGE=[],JOBLOG=[],_localOk=null,_syncLoaded=false;

async function checkLocal(){
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);
    const r=await fetch(LOCAL_SYNC+'/health',{signal:c.signal});clearTimeout(t);
    _localOk=r.ok;
  }catch(e){_localOk=false}
  return _localOk;
}
async function loadSync(){
  [CFG,USAGE,JOBLOG,FR]=await Promise.all([sbQ('cfg'),sbQ('usage'),sbQ('joblog'),sbQ('fresh')]);
  await checkLocal();
  _syncLoaded=true;
}
async function setSchedule(source,schedule){
  if(!_localOk){alert('ローカルの同期サーバー(127.0.0.1:3457)が起動していないため変更できません。\nrun_sync_server.bat を起動してください。');return}
  try{
    const r=await fetch(`${LOCAL_SYNC}/config?source=${encodeURIComponent(source)}&schedule=${encodeURIComponent(schedule)}`);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'不明なエラー');
    CFG=await sbQ('cfg'); renderSync();
    toast(`${SRC_LABEL[source]||source} の更新頻度を「${schedule}」に保存しました`);
  }catch(e){ showError(`更新頻度の保存に失敗しました → ${e.message}`); }
}
async function runNow(source){
  if(!_localOk){alert('ローカルの同期サーバー(127.0.0.1:3457)が起動していないため実行できません。');return}
  toast(`${SRC_LABEL[source]||source} を実行中…`);
  try{
    const r=await fetch(`${LOCAL_SYNC}/run?source=${encodeURIComponent(source)}`);
    const j=await r.json();
    await loadSync(); renderSync();
    const res=(j.results||{})[source]||{};
    toast(j.ok?`${SRC_LABEL[source]||source} 完了（${res.count||0}件）`:`失敗: ${res.error||j.error||''}`);
  }catch(e){ showError(`即時実行に失敗しました → ${e.message}`); }
}

    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  cfgSorted.forEach(c=>{
    const f=frMap[c.source]||{};
    const t=f.last_success?new Date(f.last_success).getTime():null;
    const mins=t?Math.floor((now-t)/60000):null;
    const stale=(mins===null)||(mins>(f.stale_after_minutes||1440));
    const ago=mins===null?'未実行':(mins<60?mins+'分前':(mins<1440?Math.floor(mins/60)+'時間前':Math.floor(mins/1440)+'日前'));
    const st=f.last_status==='ok'?'<span style="background:#0e7c66;color:#fff;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700">OK</span>'
      :f.last_status==='error'?'<span style="background:#b5502f;color:#fff;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700">ERROR</span>'
      :f.last_status==='skip'?'<span style="border:1.5px solid #8a8578;color:#8a8578;padding:1px 6px;border-radius:2px;font-size:10px;font-weight:700">SKIP</span>'
      :'<span style="border:1.5px solid #0b5344;color:#0b5344;padding:1px 6px;border-radius:2px;font-size:10px;font-weight:700">未接続</span>';
    const opts=SCHEDULE_CHOICES.map(([v,l])=>`<option value="${v}"${v===c.schedule?' selected':''}>${l}</option>`).join('');
    const planned=(c.enabled===false);
    h+=`<tr${stale&&!planned?' style="background:#f6ecda"':''}>
      <td style="padding:7px 9px;border-bottom:1px solid #e2ddd2"><b>${SRC_LABEL[c.source]||c.source}</b>
        <div style="font-size:10px;color:#8a8578">${c.source}${c.notes?' — '+c.notes:''}</div></td>
      <td style="padding:7px 9px;border-bottom:1px solid #e2ddd2">
        <select ${(!_localOk||planned)?'disabled':''} onchange="setSchedule('${c.source}',this.value)"
          style="font-size:12px;padding:3px 6px;border:1px solid #a8a294;border-radius:2px;background:#fff;width:100%">${opts}</select></td>
      <td style="padding:7px 9px;border-bottom:1px solid #e2ddd2;color:${stale&&!planned?'#c9821f':'#0e7c66'};font-weight:700">${planned?'—':ago}${stale&&!planned?' ⚠':''}</td>
      <td style="padding:7px 9px;border-bottom:1px solid #e2ddd2">${planned?'<span style="font-size:10px;color:#8a8578">計画</span>':st}</td>
      <td style="padding:7px 9px;border-bottom:1px solid #e2ddd2;text-align:right">${f.last_rows!=null?fmt(f.last_rows):'—'}</td>
      <td style="padding:7px 9px;border-bottom:1px solid #e2ddd2;text-align:center">
        ${planned?'':`<button ${_localOk?'':'disabled'} onclick="runNow('${c.source}')" style="font-size:11px;padding:3px 10px;border:1px solid #0e7c66;background:${_localOk?'#0e7c66':'#ccc'};color:#fff;border-radius:2px;cursor:pointer">今すぐ</button>`}</td></tr>`;
  });
  h+=`</table></div>`;

  // (c) ジョブ実行ログ
  h+=`<div style="background:#fff;border:1px solid #e2ddd2;padding:14px 18px">
    <div style="font-size:13px;font-weight:800;margin-bottom:4px">ジョブ実行ログ（直近40件）</div>
    <div style="font-size:11px;color:#8a8578;margin-bottom:10px">成否・件数・所要時間・転送量を毎回記録しています。失敗は握りつぶさず必ずここに残ります。</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
    <tr style="background:#1a1c1e;color:#fff"><th style="text-align:left;padding:6px 9px;width:135px">時刻</th>
      <th style="text-align:left;padding:6px 9px;width:130px">ジョブ</th><th style="text-align:left;padding:6px 9px;width:70px">結果</th>
      <th style="text-align:right;padding:6px 9px;width:70px">件数</th><th style="text-align:right;padding:6px 9px;width:70px">所要</th>
      <th style="text-align:right;padding:6px 9px;width:80px">転送</th><th style="text-align:left;padding:6px 9px">エラー内容</th></tr>`;
  if(!(JOBLOG||[]).length){
    h+=`<tr><td colspan="7" style="padding:14px;color:#8a8578">まだ記録がありません（ジョブが1回も走っていません）。</td></tr>`;
  }
  (JOBLOG||[]).forEach(j=>{
    const bad=j.status==='error';
    const badge=j.status==='ok'?'<span style="background:#0e7c66;color:#fff;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700">ok</span>'
      :bad?'<span style="background:#b5502f;color:#fff;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700">error</span>'
      :j.status==='skip'?'<span style="border:1.5px solid #8a8578;color:#8a8578;padding:1px 6px;border-radius:2px;font-size:10px">skip</span>'
      :'<span style="border:1.5px solid #c9821f;color:#c9821f;padding:1px 6px;border-radius:2px;font-size:10px">running</span>';
    h+=`<tr${bad?' style="background:#fbf1ec"':''}>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2">${new Date(j.started_at).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2"><code style="font-size:11px">${j.job}</code></td>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2">${badge}</td>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2;text-align:right">${j.rows_written?fmt(j.rows_written):'—'}</td>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2;text-align:right">${j.duration_ms!=null?(j.duration_ms/1000).toFixed(1)+'秒':'—'}</td>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2;text-align:right">${j.bytes_out?Math.round(j.bytes_out/1024)+' KB':'—'}</td>
      <td style="padding:6px 9px;border-bottom:1px solid #e2ddd2;font-size:11px;color:${bad?'#b5502f':'#8a8578'};font-weight:${bad?700:400}">${j.error_msg||'正常終了'}</td></tr>`;
  });
  h+=`</table></div>`;
  el.innerHTML=h;
}

async function init(){
  try{
    _bytes=0;_calls=0;
    await loadCore();
    clearError();
    const ds=D.map(d=>d.date).sort();
    if(ds.length){
      const el=id=>document.getElementById(id);
      const today=new Date().toISOString().slice(0,10);const maxD=ds[ds.length-1]>today?ds[ds.length-1]:today;
      el('startDate').value=ds[0];el('startDate').min=ds[0];el('startDate').max=maxD;
      el('endDate').value=maxD;el('endDate').min=ds[0];el('endDate').max=maxD;
      el('dateRangeInfo').textContent=`データ範囲: ${ds[0]} ~ ${maxD}`;
    }
    const ec=(FR||[]).find(s=>s.source==='ec_orders');
    const lt=ec&&ec.last_success?new Date(ec.last_success).toLocaleString('ja-JP'):'未同期';
    document.getElementById('syncTs').textContent=
      `最終更新: ${lt}（自動刷新: 30分毎・画面表示中のみ / 今回の転送 ${(_bytes/1024).toFixed(0)}KB・${_calls}クエリ）`;
    renderAll();
  }catch(e){
    showError('初期読み込みに失敗しました → '+e.message);
    document.getElementById('syncTs').textContent='読み込みエラー: '+e.message;
  }
}

// ===== 自動リフレッシュ（Egress節約版: 30分毎＋画面を開いている間のみ） =====
// データ同期(ec_aggregator)は1時間毎のため、5分毎の全件再取得は無駄でEgressを圧迫していた。
// (1)間隔を30分に延長 (2)タブ非表示中は停止（深夜の開きっぱなしで回り続けるのを防止）。
var _autoRefreshId = null;
var _refreshBusy = false;
var REFRESH_MS = 30 * 60 * 1000; // 30分
// 条件付きリフレッシュ（2026-08-07 Phase1 Task1.3）
// まず kpi_freshness（約1KB）だけ取得し、前回から更新が無ければ本体を取りに行かない。
// 30分毎のポーリングが毎回3MBを運んでいたのを、変化が無い限り1KBで済ませる。
let _lastFreshSig = null;
async function doRefresh(force) {
  if (_refreshBusy || document.hidden) return;   // 非表示中は通信しない
  _refreshBusy = true;
  try {
    _bytes=0;_calls=0;
    const fresh = await sbQ('fresh');
    const sig = (fresh||[]).map(r=>r.source+':'+(r.last_success||'')).sort().join('|');
    FR = fresh; renderFreshness(FR);
    if (!force && _lastFreshSig !== null && sig === _lastFreshSig) {
      document.getElementById('syncTs').textContent =
        `最終確認: ${new Date().toLocaleString('ja-JP')}（更新なし・${(_bytes/1024).toFixed(1)}KBのみ確認）`;
      clearError();
      return;                                    // ← 本体は取りに行かない
    }
    _lastFreshSig = sig;
    console.log('[自動リフレッシュ] 更新を検出。データ再取得中...');
    var EX=[];
    [D,O,G,S,I,SEO,EX,SY]=await Promise.all([
      sbQ('daily'),sbQ('orders'),sbQ('ga4'),sbQ('sns'),sbQ('inv'),sbQ('seo'),sbQ('excl'),sbQ('sync'),
    ]);
    applyOrderFilters(EX);
    if(_seoLoaded){ _seoLoaded=false; await loadSeoDetail(); }  // 既に開いていた時だけ再取得
    renderAll();
    clearError();
    var now=new Date().toLocaleString('ja-JP');
    document.getElementById('syncTs').textContent=
      `最終更新: ${now}（自動刷新: 30分毎・画面表示中のみ / 今回の転送 ${(_bytes/1024).toFixed(0)}KB・${_calls}クエリ）`;
    console.log('[自動リフレッシュ] 完了 ' + now);
  } catch(e) {
    console.error('[自動リフレッシュ] エラー:', e);
    showError('自動更新に失敗しました → '+e.message);   // 握りつぶさない
  } finally { _refreshBusy = false; }
}
function startAutoRefresh() { if (!_autoRefreshId && !document.hidden) _autoRefreshId = setInterval(doRefresh, REFRESH_MS); }
function stopAutoRefresh() { if (_autoRefreshId) { clearInterval(_autoRefreshId); _autoRefreshId = null; } }
// タブの表示/非表示で制御（非表示＝通信停止／再表示＝1回だけ更新して再開）
document.addEventListener('visibilitychange', function() {
  if (document.hidden) stopAutoRefresh();
  else { doRefresh(); startAutoRefresh(); }
});
// 手動更新ボタン用（任意）
window.kpiManualRefresh = doRefresh;
// 初回ロード後に自動リフレッシュ開始
setTimeout(startAutoRefresh, 10000);

function renderAll(){
  const d=filt(D),o=filt(O,'order_date'),g=filt(G);
  renderDash(d,o);renderCharts(d,o);renderProduct(o);renderGA4(g);
  renderReport(d,o);renderProfit(d,o);renderKPI(d,o,g,S);renderInv(I);renderSNS(S);renderSEO(filt(SEO),SEO_ART,SEO_QRY);renderHistory(O,SY);renderChannel(O);renderCompare(O);
}

// ===== 1. ダッシュボード =====
function renderDash(d,o){
  const rev=d.reduce((s,x)=>s+Number(x.revenue||0),0);
  const ords=d.reduce((s,x)=>s+(x.order_count||0),0);
  const qty=o.reduce((s,x)=>s+(x.quantity||0),0);
  const aov=ords>0?rev/ords:0;

  // 無償サンプル（Qoo10サンプルマーケット / Amazon Vine など金額0の配布分）を件数から切り分ける。
  // 売上金額は元々0なので金額側には影響しないが、件数・平均単価は実売と大きく乖離するため併記する。
  const isFree=x=>Number(x.total||0)===0;
  const freeByCh={};let freeCnt=0,freeQty=0;
  o.forEach(x=>{if(isFree(x)){freeCnt++;freeQty+=(x.quantity||0);freeByCh[x.channel]=(freeByCh[x.channel]||0)+1;}});
  const paidOrds=Math.max(ords-freeCnt,0);
  const aovPaid=paidOrds>0?rev/paidOrds:0;
  const freeNote=n=>n>0?`<span style="color:var(--sub);font-size:11px"> (無償${fmt(n)})</span>`:'';

  // Channel
  const ch={};d.forEach(x=>{if(!ch[x.channel])ch[x.channel]={rev:0,ord:0};ch[x.channel].rev+=Number(x.revenue||0);ch[x.channel].ord+=(x.order_count||0)});
  const chArr=Object.entries(ch).sort((a,b)=>b[1].rev-a[1].rev);
  let chRows=chArr.map(([c,v])=>`<tr><td>${chBadge(c)}</td><td class="num">${yen(v.rev)}</td><td class="num">${fmt(v.ord)}件${freeNote(freeByCh[c]||0)}</td></tr>`).join('');

  // Product TOP10
  const prods={};o.forEach(x=>{const n=normProd(x.product_name);if(!prods[n])prods[n]={rev:0,qty:0,free:0};prods[n].rev+=Number(x.total||0);prods[n].qty+=(x.quantity||0);if(isFree(x))prods[n].free+=(x.quantity||0)});
  const pArr=Object.entries(prods).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10);
  let pRows=pArr.map(([n,v])=>`<tr><td>${n}</td><td class="num">${yen(v.rev)}</td><td class="num">${fmt(v.qty)}個${freeNote(v.free)}</td></tr>`).join('');

  // Subscription
  const subs=o.filter(x=>x.is_subscription);
  const subRev=subs.reduce((s,x)=>s+Number(x.total||0),0);
  const subByCount={};
  subs.forEach(x=>{const c=x.subscription_count||1;if(!subByCount[c])subByCount[c]={cnt:0,rev:0};subByCount[c].cnt++;subByCount[c].rev+=Number(x.total||0)});
  let subRows=`<tr><td>定期注文件数</td><td class="num"><strong>${fmt(subs.length)}</strong></td></tr>`;
  subRows+=`<tr><td>定期売上合計</td><td class="num"><strong>${yen(subRev)}</strong></td></tr>`;
  Object.entries(subByCount).sort((a,b)=>Number(a[0])-Number(b[0])).forEach(([c,v])=>{
    subRows+=`<tr><td>　${c}回目</td><td class="num">${fmt(v.cnt)}件 / ${yen(v.rev)}</td></tr>`;
  });

  // Customer - ユニーク注文はorders明細から（Amazon/Qoo10含む）、注文件数はdaily_summaryから
  const uniqOrders=new Set(o.map(x=>x.order_id)).size;

  document.getElementById('tab-dashboard').innerHTML=`
    <div class="grid grid-4">
      <div class="card"><h2>売上合計</h2><div class="metric">${yen(rev)}</div><div class="metric-sub">フィルター期間内</div></div>
      <div class="card"><h2>注文件数</h2><div class="metric" style="color:var(--blue)">${fmt(ords)}</div><div class="metric-sub">${freeCnt>0?`うち無償 ${fmt(freeCnt)}件 / 実売 ${fmt(paidOrds)}件<br>平均単価: ${yen(Math.round(aov))}（実売ベース ${yen(Math.round(aovPaid))}）`:`平均単価: ${yen(Math.round(aov))}`}</div></div>
      <div class="card"><h2>商品販売数</h2><div class="metric" style="color:var(--purple)">${fmt(qty)}<span style="font-size:14px;color:var(--sub)">個</span></div></div>
      <div class="card"><h2>注文明細数</h2><div class="metric" style="color:var(--employee)">${fmt(o.length)}<span style="font-size:12px;color:var(--sub)"> 行</span></div><div class="metric-sub">ユニーク注文: ${fmt(uniqOrders)}</div></div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h2>チャネル別売上</h2>
        <table><thead><tr><th>チャネル</th><th class="num">売上</th><th class="num">注文数</th></tr></thead><tbody>${chRows||'<tr><td colspan="3">データなし</td></tr>'}</tbody></table>
      </div>
      <div class="card"><h2>商品別売上 TOP10</h2>
        <table><thead><tr><th>商品名</th><th class="num">売上</th><th class="num">数量</th></tr></thead><tbody>${pRows||'<tr><td colspan="3">データなし</td></tr>'}</tbody></table>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h2>定期購入分析</h2><table>${subRows}</table></div>
      <div class="card"><h2>顧客分析</h2>
        <table>
          <tr><td>注文件数（全チャネル）</td><td class="num"><strong>${fmt(ords)}</strong></td></tr>
          <tr><td>　うち無償サンプル</td><td class="num" style="color:var(--sub)">${fmt(freeCnt)}件</td></tr>
          <tr><td>　実売注文件数</td><td class="num"><strong>${fmt(paidOrds)}</strong>件</td></tr>
          <tr><td>注文明細（Shopify/社割/卸売）</td><td class="num">${fmt(uniqOrders)}件</td></tr>
          <tr><td>平均注文額(AOV)</td><td class="num">${yen(Math.round(aov))}</td></tr>
          <tr><td>　AOV（実売ベース）</td><td class="num"><strong>${yen(Math.round(aovPaid))}</strong></td></tr>
          <tr><td>総販売数量</td><td class="num">${fmt(qty)}個</td></tr>
          <tr><td>　うち無償配布数</td><td class="num" style="color:var(--sub)">${fmt(freeQty)}個</td></tr>
        </table>
        <div style="font-size:11px;color:var(--sub);margin-top:8px">※注文明細はShopify/社割/卸売のみ。Amazon/Qoo10はサマリー集計のみ対応。<br>※「無償」＝金額0の配布分（Qoo10サンプルマーケット／Amazon Vine等）。売上金額には元々含まれないため、金額指標には影響しません。</div>
      </div>
    </div>`;
}

// ===== 2. グラフ分析 =====
function renderCharts(d,o){
  const byDate={};d.forEach(x=>{if(!byDate[x.date])byDate[x.date]={rev:0,ord:0};byDate[x.date].rev+=Number(x.revenue||0);byDate[x.date].ord+=(x.order_count||0)});
  const dates=Object.keys(byDate).sort();
  // Channel pie
  const ch={};d.forEach(x=>{ch[x.channel]=(ch[x.channel]||0)+Number(x.revenue||0)});
  // Monthly
  const byM={};d.forEach(x=>{const m=x.date.slice(0,7);if(!byM[m])byM[m]={rev:0,ord:0};byM[m].rev+=Number(x.revenue||0);byM[m].ord+=(x.order_count||0)});
  const months=Object.keys(byM).sort();
  // Prefecture
  const byPref={};o.forEach(x=>{const p=x.prefecture||'不明';if(p&&p!=='null'&&p!=='不明'){byPref[p]=(byPref[p]||0)+Number(x.total||0)}});
  const prefArr=Object.entries(byPref).sort((a,b)=>b[1]-a[1]).slice(0,10);

  document.getElementById('tab-charts').innerHTML=`
    <div class="grid grid-1"><div class="card"><h2>日別売上推移</h2><div class="chart-box"><canvas id="cDailyRev"></canvas></div></div></div>
    <div class="grid grid-2">
      <div class="card"><h2>チャネル別構成比</h2><div class="chart-box"><canvas id="cChannelPie"></canvas></div></div>
      <div class="card"><h2>月別売上推移</h2><div class="chart-box"><canvas id="cMonthlyBar"></canvas></div></div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h2>都道府県別売上 TOP10</h2><div class="chart-box"><canvas id="cPrefBar"></canvas></div></div>
      <div class="card"><h2>月別サマリー</h2>
        <table><thead><tr><th>月</th><th class="num">売上</th><th class="num">注文数</th></tr></thead>
        <tbody>${months.map(m=>`<tr><td>${m}</td><td class="num">${yen(byM[m].rev)}</td><td class="num">${fmt(byM[m].ord)}件</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;

  destroyC('cDailyRev');destroyC('cChannelPie');destroyC('cMonthlyBar');destroyC('cPrefBar');
  const cOpt={responsive:true,maintainAspectRatio:false,plugins:{datalabels:{display:false},legend:{labels:{font:{size:11}}}}};
  charts.cDailyRev=new Chart(document.getElementById('cDailyRev'),{type:'line',data:{labels:dates,datasets:[{label:'売上',data:dates.map(d=>byDate[d].rev),borderColor:'#667eea',backgroundColor:'rgba(102,126,234,.1)',fill:true,tension:.3,pointRadius:1}]},options:{...cOpt,scales:{x:{ticks:{maxTicksLimit:15,font:{size:10}},grid:{display:false}},y:{ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k',font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}}}}});
  const chKeys=Object.keys(ch),chColors=['#96bf48','#f59e0b','#6366f1','#ff9900','#e31937','#bf0000','#667eea'];
  charts.cChannelPie=new Chart(document.getElementById('cChannelPie'),{type:'doughnut',data:{labels:chKeys.map(chName),datasets:[{data:chKeys.map(k=>ch[k]),backgroundColor:chColors}]},options:{...cOpt,plugins:{...cOpt.plugins,datalabels:{color:'#fff',font:{weight:'bold',size:11},formatter:(v,ctx)=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return t>0?((v/t)*100).toFixed(0)+'%':''}},legend:{position:'bottom',labels:{padding:10,font:{size:11}}}}}});
  charts.cMonthlyBar=new Chart(document.getElementById('cMonthlyBar'),{type:'bar',data:{labels:months,datasets:[{label:'売上',data:months.map(m=>byM[m].rev),backgroundColor:'rgba(102,126,234,.6)',borderColor:'#667eea',borderWidth:1}]},options:{...cOpt,scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k',font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}}}}});
  if(prefArr.length>0){
    charts.cPrefBar=new Chart(document.getElementById('cPrefBar'),{type:'bar',data:{labels:prefArr.map(p=>p[0]),datasets:[{label:'売上',data:prefArr.map(p=>p[1]),backgroundColor:'rgba(99,102,241,.6)'}]},options:{...cOpt,indexAxis:'y',scales:{x:{ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k',font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},y:{ticks:{font:{size:10}},grid:{display:false}}}}});
  }

// ===== 3. 商品別詳細 =====
function renderProduct(o){
  const byProd={};
  o.forEach(x=>{
    const n=normProd(x.product_name);
    if(!byProd[n])byProd[n]={total:0,qty:0,ch:{}};
    byProd[n].total+=Number(x.total||0);byProd[n].qty+=(x.quantity||0);
    const c=x.channel||'不明';
    if(!byProd[n].ch[c])byProd[n].ch[c]={rev:0,qty:0};
    byProd[n].ch[c].rev+=Number(x.total||0);byProd[n].ch[c].qty+=(x.quantity||0);
  });
  const arr=Object.entries(byProd).sort((a,b)=>b[1].total-a[1].total);

  // Channel summary cards
  const chTotals={};
  o.forEach(x=>{const c=x.channel||'不明';if(!chTotals[c])chTotals[c]={rev:0,qty:0};chTotals[c].rev+=Number(x.total||0);chTotals[c].qty+=(x.quantity||0)});
  const totalRev=o.reduce((s,x)=>s+Number(x.total||0),0);
  const totalQty=o.reduce((s,x)=>s+(x.quantity||0),0);
  const chOrder=['shopify','employee','wholesale','amazon','amazon_fba','qoo10','rakuten'];
  let chCards=chOrder.map(c=>{const v=chTotals[c]||{rev:0,qty:0};return`
    <div class="card" style="text-align:center"><h2>${chBadge(c)}</h2>
      <div style="font-size:18px;font-weight:700">${fmt(v.qty)}個</div>
      <div style="font-size:13px;color:var(--sub)">${yen(v.rev)}</div>
    </div>`}).join('');
  chCards+=`<div class="card" style="text-align:center;border:2px solid var(--accent)"><h2>合計</h2>
    <div style="font-size:18px;font-weight:700">${fmt(totalQty)}個</div>
    <div style="font-size:13px;color:var(--accent)">${yen(totalRev)}</div></div>`;

  let prodHtml=arr.map(([n,data])=>{
    let chRows=Object.entries(data.ch).sort((a,b)=>b[1].rev-a[1].rev)
      .map(([c,v])=>`<tr><td>${chBadge(c)}</td><td class="num">${yen(v.rev)}</td><td class="num">${fmt(v.qty)}個</td></tr>`).join('');
    return`<div class="card"><h3>${n} <span class="badge-info">${yen(data.total)} / ${fmt(data.qty)}個</span></h3>
      <table><thead><tr><th>チャネル</th><th class="num">売上</th><th class="num">数量</th></tr></thead><tbody>${chRows}</tbody></table></div>`;
  }).join('');

  document.getElementById('tab-product').innerHTML=`
    <div class="grid" style="grid-template-columns:repeat(6,1fr)">${chCards}</div>
    <div class="grid grid-2">${prodHtml}</div>`;
}

  if(srcs.length){const top=srcs.sort((a,b)=>(b.sessions||0)-(a.sessions||0)).slice(0,8);charts.cGaSrc=new Chart(document.getElementById('cGaSrc'),{type:'bar',data:{labels:top.map(x=>x.dimension),datasets:[{label:'Sessions',data:top.map(x=>x.sessions||0),backgroundColor:'rgba(102,126,234,.6)'}]},options:{...cOpt,indexAxis:'y',scales:{x:{grid:{color:'rgba(0,0,0,.05)'}},y:{ticks:{font:{size:10}},grid:{display:false}}}}});}

// ===== 5. 売上報告 =====
function renderReport(d,o){
  // Product breakdown by channel
  const prods={};
  o.forEach(x=>{
    const n=normProd(x.product_name);const c=x.channel||'不明';
    if(!prods[n])prods[n]={};
    if(!prods[n][c])prods[n][c]={qty:0,rev:0};
    prods[n][c].qty+=(x.quantity||0);prods[n][c].rev+=Number(x.total||0);
  });

  const chIcons={shopify:'🛒 ECサイト',employee:'👥 社割購入',wholesale:'🏥 クリニック卸売',amazon:'🅰️ Amazon',amazon_fba:'📦 Amazon(FBA)',qoo10:'🔵 Qoo10',rakuten:'🔴 楽天'};
  const startD=dS||D.map(x=>x.date).sort()[0]||'';
  const endD=dE||D.map(x=>x.date).sort().pop()||'';
  let report=`売上報告(${startD} ~ ${endD})\n${'='.repeat(40)}\n\n`;

  Object.entries(prods).sort((a,b)=>{const ta=Object.values(a[1]).reduce((s,v)=>s+v.rev,0);const tb=Object.values(b[1]).reduce((s,v)=>s+v.rev,0);return tb-ta}).forEach(([name,chs])=>{
    report+=`■ ${name}\n`;
    report+='【売上数量】\n';
    let totalQty=0,totalRev=0;
    ['shopify','employee','wholesale','amazon','amazon_fba','qoo10','rakuten'].forEach(c=>{
      if(chs[c]){report+=`${chIcons[c]||c}: ${chs[c].qty}個\n`;totalQty+=chs[c].qty}
    });
    report+=`📊 合計: ${totalQty}個\n\n`;
    report+='【売上金額】\n';
    ['shopify','employee','wholesale','amazon','amazon_fba','qoo10','rakuten'].forEach(c=>{
      if(chs[c]){report+=`${chIcons[c]||c}: ¥${chs[c].rev.toLocaleString()}\n`;totalRev+=chs[c].rev}
    });
    report+=`📊 合計: ¥${totalRev.toLocaleString()}\n\n`;
  });

  const totalAll=o.reduce((s,x)=>s+Number(x.total||0),0);
  report+=`${'='.repeat(40)}\n総売上合計: ¥${totalAll.toLocaleString()}\n`;

  document.getElementById('tab-report').innerHTML=`
    <div class="card" style="margin-bottom:16px">
      <h3>売上報告テキスト <button class="copy-btn" onclick="copyReport()">📋 クリップボードにコピー</button></h3>
      <div class="report-preview" id="reportText">${report}</div>
    </div>`;
}

function copyReport(){
  const text=document.getElementById('reportText').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.copy-btn');btn.textContent='✅ コピーしました';
    setTimeout(()=>btn.textContent='📋 クリップボードにコピー',2000);
  });
}

// ===== 6. 利益比較 =====
function renderProfit(d,o){
  // Period comparison
  const dates=d.map(x=>x.date).sort();
  if(dates.length<2){document.getElementById('tab-profit').innerHTML='<div class="card">データ不足</div>';return}
  const mid=dates[Math.floor(dates.length/2)];
  const prev=d.filter(x=>x.date<mid),curr=d.filter(x=>x.date>=mid);
  const prevO=o.filter(x=>x.order_date&&x.order_date<mid),currO=o.filter(x=>x.order_date&&x.order_date>=mid);

  const prevRev=prev.reduce((s,x)=>s+Number(x.revenue||0),0);
  const currRev=curr.reduce((s,x)=>s+Number(x.revenue||0),0);
  const diff=currRev-prevRev;
  const prevQty=prevO.reduce((s,x)=>s+(x.quantity||0),0);
  const currQty=currO.reduce((s,x)=>s+(x.quantity||0),0);

  // Product breakdown
  const prodPrev={},prodCurr={};
  prevO.forEach(x=>{const n=normProd(x.product_name);if(!prodPrev[n])prodPrev[n]={qty:0,rev:0};prodPrev[n].qty+=(x.quantity||0);prodPrev[n].rev+=Number(x.total||0)});
  currO.forEach(x=>{const n=normProd(x.product_name);if(!prodCurr[n])prodCurr[n]={qty:0,rev:0};prodCurr[n].qty+=(x.quantity||0);prodCurr[n].rev+=Number(x.total||0)});
  const allProds=new Set([...Object.keys(prodPrev),...Object.keys(prodCurr)]);
  let profitRows=[...allProds].sort().map(n=>{
    const p=prodPrev[n]||{qty:0,rev:0},c=prodCurr[n]||{qty:0,rev:0};
    const d=c.rev-p.rev;
    return`<tr><td>${n}</td><td class="num">${fmt(p.qty)}</td><td class="num">${fmt(c.qty)}</td><td class="num">${yen(p.rev)}</td><td class="num">${yen(c.rev)}</td><td class="num" style="color:${d>=0?'var(--green)':'var(--red)'}">${d>=0?'+':''}${yen(d)}</td></tr>`;
  }).join('');

  document.getElementById('tab-profit').innerHTML=`
    <div class="grid grid-3">
      <div class="card"><h2>前半期間 販売数</h2><div class="metric" style="color:var(--sub)">${fmt(prevQty)}<span style="font-size:14px">個</span></div><div class="metric-sub">${dates[0]} ~ ${mid}</div></div>
      <div class="card"><h2>後半期間 販売数</h2><div class="metric" style="color:var(--accent)">${fmt(currQty)}<span style="font-size:14px">個</span></div><div class="metric-sub">${mid} ~ ${dates[dates.length-1]}</div></div>
      <div class="card"><h2>売上増減</h2><div class="metric" style="color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${yen(diff)}</div></div>
    </div>
    <div class="grid grid-1"><div class="card"><h3>商品別 期間比較</h3>
      <table><thead><tr><th>商品名</th><th class="num">前半数量</th><th class="num">後半数量</th><th class="num">前半売上</th><th class="num">後半売上</th><th class="num">増減</th></tr></thead><tbody>${profitRows}</tbody></table>
    </div></div>`;
}

  const tSess=daily.reduce((s,x)=>s+(x.sessions||0),0);
  const aov=ords>0?Math.round(rev/ords):0;

  // Data sources
  const dsSt=[{n:'Shopify売上',ok:d.length>0},{n:'GA4セッション',ok:daily.length>0},{n:'GA4流入元',ok:srcs.length>0},{n:'GA4デバイス別',ok:devs.length>0},{n:'SNS分析',ok:s.length>0}];
  let dsHtml=dsSt.map(x=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:${x.ok?'var(--green)':'var(--red)'}"></span>${x.n}</div>`).join('');

// SNSデータをextra_jsonからfallback取得 (ダッシュボード概要タブ等で使用)
function snsVal(row, key){
  if(!row) return 0;
  if(row[key] && row[key]>0) return row[key];
  try{
    const ej=JSON.parse(row.extra_json||'{}');
    if(ej[key]>0) return ej[key];
    const am=ej.account_metrics||{};
    if(am[key]>0) return am[key];
    if(key==='followers'){
      if(ej.friends&&ej.friends.target_reach>0) return ej.friends.target_reach;
    }
    if(key==='reach') return ej.reach_30d||am.reach_30d||0;
    if(key==='impressions') return ej.views_30d||ej.video_views_7d||0;
    if(key==='likes') return ej.interactions_30d||ej.likes_7d||0;
  }catch(e){}
  return row[key]||0;
}

function parseSnsExtra(row){

// SNSデータを platform + account_metrics 形式に正規化
function normalizeSnsRows(sns, platform){
  return sns.filter(x=>x.platform===platform).sort((a,b)=>a.date.localeCompare(b.date)).map(row=>{
    const ej=parseSnsExtra(row);
    const result={date:row.date, is_dummy:ej.collection_method==='sample'};
    if(platform==='instagram'){
      result.account_metrics={
        followers:ej.followers||row.followers||0,
        reach_30d:ej.reach_30d||0,
        interactions_30d:ej.interactions_30d||0,
        profile_access:ej.profile_views||ej.profile_access||0,
        external_link_taps:ej.link_taps||ej.external_link_taps||0,
        views_30d:ej.views_30d||0,
        content_engagement_rate:ej.content_engagement_rate||0
      };
      if(ej.top_posts_30d) result.top_posts_30d=ej.top_posts_30d;
      if(ej.content_view_ratio) result.content_view_ratio=ej.content_view_ratio;
    } else if(platform==='tiktok'){
      result.account_metrics={
        followers_total:ej.followers||row.followers||0,
        followers_change_7d:ej.followers_change_7d||0,
        video_views_7d:ej.video_views_7d||0,
        likes_7d:ej.likes_7d||0,
        comments_7d:ej.comments_7d||0,
        shares_7d:ej.shares_7d||0,
        profile_views_7d:ej.profile_views_7d||0
      };
      if(ej.demographics) result.demographics=ej.demographics;
      if(ej.traffic_sources) result.traffic_sources=ej.traffic_sources;
      if(ej.top_posts_7d) result.top_posts_7d=ej.top_posts_7d;
    } else if(platform==='line'){
      // LINE: extra_json をそのままマージ
      Object.assign(result, ej);
      result.friends=ej.friends||{};
      result.messages=ej.messages||{};
      result.chat=ej.chat||{};
      result.rich_menu=ej.rich_menu||{};
      result.voom=ej.voom||{};
      result.demographics=ej.demographics||{};
      result.broadcasts=ej.broadcasts||[];
    } else if(platform==='threads'){
      result.account_metrics={
        followers:ej.followers||row.followers||0,
        views_30d:ej.views_30d||0,
        interactions_30d:ej.interactions_30d||0
      };
      result.interactions=ej.interactions||{};
      result.view_sources=ej.view_sources||{};
      result.demographics=ej.demographics||{};
      if(ej.posts) result.posts=ej.posts;
    }
    return result;
  });
}

// 日付間を線形補間で埋める (v008移植)
function interpolateDailyMap(sparseMap){
  const dates=Object.keys(sparseMap).sort();
  if(dates.length<2) return sparseMap;
  const d0=new Date(dates[0]),d1=new Date(dates[dates.length-1]);
  const allD=[];
  for(let d=new Date(d0);d<=d1;d.setDate(d.getDate()+1)) allD.push(d.toISOString().slice(0,10));
  const filled={};
  allD.forEach(d=>{filled[d]=sparseMap[d]!==undefined?sparseMap[d]:null});
  let prevIdx=null;
  for(let i=0;i<allD.length;i++){
    if(filled[allD[i]]!==null){
      if(prevIdx!==null&&i-prevIdx>1){
        const v0=filled[allD[prevIdx]],v1=filled[allD[i]];
        for(let j=prevIdx+1;j<i;j++){
          const ratio=(j-prevIdx)/(i-prevIdx);
          filled[allD[j]]=Math.round(v0+(v1-v0)*ratio);
        }
      }
      prevIdx=i;
    }
  }
  return filled;
}

// TikTok推定フォロワー計算
function ttEstimatedFollowers(ttData, targetMetrics){
  if(ttData.length===0) return 0;

  const firstChange=(ttData[0].account_metrics||{}).followers_change_7d||0;
  return base+((targetMetrics.followers_change_7d||0)-firstChange);
}

const SEO_SITES={HD:{name:'家来るドクター',color:'#7c3aed'},chiba:{name:'千葉美容',color:'#ec4899'},nishi:{name:'西春クリニック',color:'#0891b2'},yoko:{name:'横浜内科',color:'#ea580c'},pit:{name:'PIT DOCTOR',color:'#16a34a'}};

// --- 共通ヘルパー ---
function seoMa7(series,key){
  const r=[];
  for(let i=0;i<series.length;i++){
    if(i<6){r.push(null);continue;}
    let s=0;for(let j=i-6;j<=i;j++)s+=Number(series[j][key])||0;
    r.push(Math.round(s/7));
  }
  return r;
}
// 直近n日 vs その前n日を比較（週=7 / 月=30 / 2週=14）
function seoCompare(series,n){
  if(!series||series.length<n*2)return null;
  const recent=series.slice(-n),prev=series.slice(-n*2,-n);
  const sum=(a,k)=>a.reduce((s,d)=>s+(Number(d[k])||0),0);
  const r={};
  for(const k of['active_users','sessions','clicks','impressions']){
    const rc=sum(recent,k),pv=sum(prev,k);
    r[k]={current:rc,previous:pv,change:pv>0?((rc-pv)/pv*100):(rc>0?100:0)};
  }
  r.ctr_current=r.impressions.current>0?(r.clicks.current/r.impressions.current*100):0;
  r.ctr_previous=r.impressions.previous>0?(r.clicks.previous/r.impressions.previous*100):0;
  r.ctr_change=r.ctr_previous>0?((r.ctr_current-r.ctr_previous)/r.ctr_previous*100):0;
  return r;
}
function seoArrow(v){return v>0?`<span style="color:#16a34a">▲+${v.toFixed(1)}%</span>`:(v<0?`<span style="color:#dc2626">▼${v.toFixed(1)}%</span>`:`<span style="color:#888">→0%</span>`);}
function seoAnalyzeTrend(series){
  const p=seoCompare(series,14);
  if(!p)return'データ不足';
  const msgs=[];
  const auC=p.active_users.change;
  if(auC>10)msgs.push(`AU前2週比<strong style="color:#16a34a">+${auC.toFixed(1)}%</strong>好調`);
  else if(auC<-10)msgs.push(`AU前2週比<strong style="color:#dc2626">${auC.toFixed(1)}%</strong>下落傾向`);
  else msgs.push(`AU前2週比${auC>0?'+':''}${auC.toFixed(1)}%横ばい`);
  const clC=p.clicks.change;
  if(clC>15)msgs.push(`クリック<strong style="color:#16a34a">+${clC.toFixed(1)}%</strong>増加`);
  else if(clC<-15)msgs.push(`クリック<strong style="color:#dc2626">${clC.toFixed(1)}%</strong>減少`);
  const ctrNow=p.ctr_current.toFixed(2);
  if(p.ctr_change>10)msgs.push(`CTR ${ctrNow}%（改善傾向）`);
  else if(p.ctr_change<-10)msgs.push(`CTR ${ctrNow}%（低下傾向）`);
  else msgs.push(`CTR ${ctrNow}%（安定）`);
  return msgs.join('、');
}

// ===== 利用者要望デザイン: サイトタブ + 日次/週次 + 期間合計4カード + 月別比較バー =====
function drawSeo(){
  const S=window.__SEO;if(!S)return;
  const el=document.getElementById('tab-seo');
  const keys=S.keys;
  if(seoState.site===null||seoState.site==='all'||!S.byKey[seoState.site])seoState.site=keys[0];
  if(!seoState.gran)seoState.gran='daily';
  if(!seoState.mView)seoState.mView='chart';
  const k=seoState.site,cfg=SEO_SITES[k]||{name:k,color:'#4f5bd5'};
  const series=(S.byKey[k]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const sum=(a,key)=>a.reduce((s,d)=>s+(Number(d[key])||0),0);
  let upd='';try{const cs=series.map(r=>r.created_at).filter(Boolean).sort();if(cs.length)upd=new Date(cs[cs.length-1]).toLocaleString('ja-JP');}catch(e){}
  const latest=series.length?series[series.length-1].date:null;
  let ps=null;if(latest){const ld=new Date(latest+'T00:00:00');ps=new Date(ld.getFullYear(),ld.getMonth()-2,1).toISOString().slice(0,10);}
  const inP=series.filter(r=>!ps||r.date>=ps);
  const tot={au:sum(inP,'active_users'),cl:sum(inP,'clicks'),se:sum(inP,'sessions'),im:sum(inP,'impressions')};
  const bm={};inP.forEach(r=>{const m=r.date.slice(0,7);if(!bm[m])bm[m]={au:0,cl:0,se:0,im:0};bm[m].au+=Number(r.active_users)||0;bm[m].cl+=Number(r.clicks)||0;bm[m].se+=Number(r.sessions)||0;bm[m].im+=Number(r.impressions)||0;});
  const months=Object.keys(bm).sort().slice(-3),curM=latest?latest.slice(0,7):null;
  window.__seoMB={months,bm,curM};
  // 推移(日次/週次)
  let tr;
  if(seoState.gran==='weekly'){const wk={};series.forEach(r=>{const d=new Date(r.date+'T00:00:00'),day=(d.getDay()+6)%7,ws=new Date(d);ws.setDate(d.getDate()-day);const key=ws.toISOString().slice(0,10);if(!wk[key])wk[key]={au:0,cl:0};wk[key].au+=Number(r.active_users)||0;wk[key].cl+=Number(r.clicks)||0;});const ks=Object.keys(wk).sort();tr={labels:ks.map(x=>x.slice(5).replace('-','/')),au:ks.map(x=>wk[x].au),cl:ks.map(x=>wk[x].cl)};}
  else{const last=series.slice(-90);tr={labels:last.map(r=>r.date.slice(5).replace('-','/')),au:last.map(r=>Number(r.active_users)||0),cl:last.map(r=>Number(r.clicks)||0)};}
  window.__seoTrend=tr;
  // --- ヘッダー(タブ + 日次週次 + 更新) ---
  const tabHtml=keys.map(kk=>{const c=SEO_SITES[kk]||{name:kk,color:'#666'},on=kk===k;return `<button onclick="seoState.site='${kk}';seoState.qryPage=0;drawSeo()" style="display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid ${on?c.color:'#e2e8f0'};background:${on?c.color+'14':'#fff'};color:${on?c.color:'#475569'};border-radius:999px;cursor:pointer;font-size:13px;font-weight:700"><span style="width:8px;height:8px;border-radius:50%;background:${c.color}"></span>${c.name}</button>`;}).join('');
  const seg=(cur,opts,attr)=>`<div style="display:inline-flex;background:#f1f5f9;border-radius:8px;padding:3px">`+opts.map(o=>`<button onclick="${attr}='${o.v}';drawSeo()" style="padding:6px 15px;border:none;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:700;background:${cur===o.v?'#1e293b':'transparent'};color:${cur===o.v?'#fff':'#64748b'}">${o.n}</button>`).join('')+`</div>`;
  let h='';
  h+=`<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px"><div style="display:flex;gap:8px;flex-wrap:wrap">${tabHtml}</div><div style="margin-left:auto;display:flex;align-items:center;gap:14px">${seg(seoState.gran,[{v:'daily',n:'日次'},{v:'weekly',n:'週次'}],'seoState.gran')}<span style="font-size:12px;color:#94a3b8">更新: ${upd||'—'}</span></div></div>`;
  // --- 期間中の合計 ---
  const cardDefs=[['AU数',tot.au,'#4f5bd5','サイトを訪れたユニークユーザー数 (GA4)'],['クリック数',tot.cl,'#16a34a','検索結果からクリックされた回数 (GSC clicks)'],['SESSION数',tot.se,'#f59e0b','訪問の回数 (1人で複数回も可) (GA4)'],['表示回数',tot.im,'#a855f7','検索結果に表示された回数 (GSC impressions)']];

function seoCompareCard(title,p,color){
  if(!p)return `<div class="card"><h2>${title}</h2><p style="color:#888;font-size:13px">比較に必要な期間のデータが不足しています。</p></div>`;
  const row=(label,cur,prev,ch,suffix)=>`<tr><td style="padding:4px 0">${label}</td><td class="num">${suffix?cur.toFixed(2)+'%':cur.toLocaleString()}</td><td class="num" style="color:#aaa">${suffix?prev.toFixed(2)+'%':prev.toLocaleString()}</td><td class="num">${seoArrow(ch)}</td></tr>`;
  return `<div class="card" style="border-left:4px solid ${color||'#666'}">
    <h2>${title}</h2>
    <table style="font-size:13px;width:100%">
      <tr style="color:#888;font-size:11px"><td></td><td class="num">今回</td><td class="num">前回</td><td class="num">増減</td></tr>
      ${row('AU',p.active_users.current,p.active_users.previous,p.active_users.change)}
      ${row('セッション',p.sessions.current,p.sessions.previous,p.sessions.change)}
      ${row('クリック',p.clicks.current,p.clicks.previous,p.clicks.change)}
      ${row('表示回数',p.impressions.current,p.impressions.previous,p.impressions.change)}
      ${row('CTR',p.ctr_current,p.ctr_previous,p.ctr_change,true)}
    </table>
  </div>`;
}

function seoSiteView(k,series){
  const cfg=SEO_SITES[k]||{name:k,color:'#666'};
  const sum=(a,key)=>a.reduce((s,d)=>s+(Number(d[key])||0),0);
  const last30=series.slice(-30);
  const au30=sum(last30,'active_users'),se30=sum(last30,'sessions'),cl30=sum(last30,'clicks'),im30=sum(last30,'impressions');
  const startIdx=Math.max(0,series.length-30);
  const period=series.length?`${series[startIdx].date} ～ ${series[series.length-1].date}`:'';
  const w=seoCompare(series,7),m=seoCompare(series,30);
  let h='';
  h+='<div class="grid grid-4" style="margin-bottom:20px">';
  h+=`<div class="card" style="border-left:4px solid ${cfg.color}"><h2>${cfg.name} — AU（直近30日）</h2><div class="metric">${au30.toLocaleString()}</div><div class="metric-sub">${period}</div></div>`;
  h+=`<div class="card"><h2>セッション（直近30日）</h2><div class="metric">${se30.toLocaleString()}</div></div>`;
  h+=`<div class="card"><h2>クリック（直近30日）</h2><div class="metric">${cl30.toLocaleString()}</div></div>`;
  h+=`<div class="card"><h2>平均CTR（直近30日）</h2><div class="metric">${im30>0?(cl30/im30*100).toFixed(2):'0'}%</div></div>`;
  h+='</div>';
  h+='<div class="grid grid-2" style="margin-bottom:20px">';
  h+=seoCompareCard('週比較（直近7日 vs 前7日）',w,cfg.color);
  h+=seoCompareCard('月比較（直近30日 vs 前30日）',m,cfg.color);
  h+='</div>';
  h+=`<div class="card" style="margin-bottom:20px"><h2>${cfg.name} 推移（AU・クリックの7日移動平均）</h2><div class="chart-box" style="height:320px"><canvas id="cSeoSite"></canvas></div></div>`;

  return h;
}

// ===== 検索クエリテーブル（選択サイトに連動） =====
function renderSeoQueries(){
  const wrap=document.getElementById('seoQueryWrap');if(!wrap)return;
  const S=window.__SEO||{};
  const queries=S.queries||[];
  const sel=seoState.site;
  let rows=queries;
  if(sel&&sel!=='all')rows=rows.filter(q=>q.site_key===sel);
  if(rows.length===0){
    wrap.innerHTML='<div class="card" style="margin-top:20px"><h2>検索クエリ</h2><p style="font-size:13px;color:#666">検索クエリデータがありません。集計更新でSearch Consoleから取得されます（テーブル未作成の場合は kpi_seo_queries を作成してください）。</p></div>';
    return;
  }
  const st=seoState;
  rows=rows.slice().sort((a,b)=>{
    let av=a[st.qrySort],bv=b[st.qrySort];
    if(typeof av==='string')return (av||'').localeCompare(bv||'','ja')*(st.qryDir==='asc'?1:-1);
    return((av||0)-(bv||0))*(st.qryDir==='asc'?1:-1);
  });
  const total=rows.length,perPage=20;
  const maxPage=Math.max(0,Math.ceil(total/perPage)-1);
  if(st.qryPage>maxPage)st.qryPage=maxPage;
  const start=st.qryPage*perPage,pageRows=rows.slice(start,start+perPage);
  const totClicks=rows.reduce((s,r)=>s+(r.clicks||0),0),totImp=rows.reduce((s,r)=>s+(r.impressions||0),0);
  const avgCtr=totImp>0?(totClicks/totImp*100).toFixed(2):'0';
  const period=rows[0]?`${rows[0].period_start||''} ～ ${rows[0].period_end||''}`:'';
  const showSite=(sel==='all');
  const sortIcon=(key)=>st.qrySort!==key?'<span style="color:#ccc">⇅</span>':(st.qryDir==='asc'?'<span style="color:#667eea">▲</span>':'<span style="color:#667eea">▼</span>');
  const sc=(key)=>`onclick="if(seoState.qrySort==='${key}'){seoState.qryDir=seoState.qryDir==='asc'?'desc':'asc'}else{seoState.qrySort='${key}';seoState.qryDir='desc'};seoState.qryPage=0;renderSeoQueries()"`;
  let h='<div class="card" style="margin-top:20px">';
  h+=`<h2>検索クエリ${showSite?'（全サイト）':'（'+((SEO_SITES[sel]||{}).name||sel)+'）'}</h2>`;
  h+=`<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0">`;
  h+=`<span style="font-size:14px;font-weight:700">${fmt(total)} クエリ</span>`;
  h+=`<span style="font-size:12px;color:#666">合計クリック <strong>${fmt(totClicks)}</strong></span>`;
  h+=`<span style="font-size:12px;color:#666">合計表示 <strong>${fmt(totImp)}</strong></span>`;
  h+=`<span style="font-size:12px;color:#666">平均CTR <strong>${avgCtr}%</strong></span>`;
  if(period)h+=`<span style="font-size:11px;color:#999;margin-left:auto">${period}</span>`;
  h+='</div>';
  h+=`<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">`;
  h+=`<thead><tr style="background:#f1f5f9;border-bottom:2px solid #e2e8f0">`;
  if(showSite)h+=`<th style="padding:8px;text-align:left;white-space:nowrap">サイト</th>`;
  h+=`<th style="padding:8px;text-align:left;cursor:pointer;min-width:200px" ${sc('query')}>検索クエリ ${sortIcon('query')}</th>`;
  h+=`<th style="padding:8px;text-align:right;cursor:pointer;white-space:nowrap" ${sc('clicks')}>クリック ${sortIcon('clicks')}</th>`;
  h+=`<th style="padding:8px;text-align:right;cursor:pointer;white-space:nowrap" ${sc('impressions')}>表示回数 ${sortIcon('impressions')}</th>`;
  h+=`<th style="padding:8px;text-align:right;cursor:pointer;white-space:nowrap" ${sc('ctr')}>CTR ${sortIcon('ctr')}</th>`;
  h+=`<th style="padding:8px;text-align:right;cursor:pointer;white-space:nowrap" ${sc('position')}>平均順位 ${sortIcon('position')}</th>`;
  h+=`</tr></thead><tbody>`;
  pageRows.forEach((r,i)=>{
    const bg=i%2===0?'#fff':'#fafafa';
    const pos=r.position!=null?Number(r.position).toFixed(1):'-';
    const posColor=pos!=='-'?(Number(pos)<=3?'#ca8a04':Number(pos)<=10?'#3b82f6':'#333'):'#999';
    const ctrVal=r.ctr!=null?(Number(r.ctr)*100).toFixed(2)+'%':'-';

function renderSeoArticles(articles){
  const wrap=document.getElementById('seoArticleWrap');
  if(!wrap)return;
  if(!articles||articles.length===0){
    wrap.innerHTML='<div class="card"><h2>記事別SEOデータ</h2><p>記事別データがありません。集計更新ボタンでSearch Consoleデータを取得してください。</p></div>';
    return;
  }
  const st=seoArtState;
  // フィルタ
  let rows=st.siteFilter==='all'?articles:articles.filter(a=>a.site_key===st.siteFilter);
  // ソート
  rows=rows.slice().sort((a,b)=>{
    let av=a[st.sortKey],bv=b[st.sortKey];
    if(typeof av==='string')return (av||'').localeCompare(bv||'','ja')*(st.sortDir==='asc'?1:-1);
    return((av||0)-(bv||0))*(st.sortDir==='asc'?1:-1);
  });
  // 統計
  const total=rows.length;
  const totalClicks=rows.reduce((s,r)=>s+(r.clicks||0),0);
  const totalImp=rows.reduce((s,r)=>s+(r.impressions||0),0);
  const avgCtr=totalImp>0?(totalClicks/totalImp*100).toFixed(2):'0';
  // ページネーション
  const perPage=20;
  const maxPage=Math.max(0,Math.ceil(total/perPage)-1);

const GAS_SYNC_URL='https://script.google.com/macros/s/AKfycbzHBAGsgTyjXpT9CK1R9rt67_eXhymiHAj2Eb3ENCZzTaTg9a_WWcT8bPkNz6CWF8XO/exec';
const SNS_API_URL='http://127.0.0.1:3456';

// SNS収集データをSupabaseにupsert
async function upsertSnsToSupabase(platform, data){
  const today=new Date().toISOString().slice(0,10);
  const am=data.account_metrics||{};
  const friends=data.friends||{};
  const row={
    date:today, platform,
    followers: data.followers||am.followers||friends.target_reach||0,
    posts: data.posts||data.post_count||am.posts||0,
    likes: data.likes||data.total_likes||data.interactions_30d||data.likes_7d||0,
    comments: data.comments||data.comments_7d||0,
    shares: data.shares||data.shares_7d||0,
    impressions: data.impressions||am.views_90d||data.views_30d||data.video_views_7d||0,
    reach: data.reach||am.reach_30d||data.reach_30d||0,
    extra_json: JSON.stringify(data)
  };
  const r=await fetch(`${SB}/rest/v1/kpi_sns_metrics?on_conflict=date,platform`,{
    method:'POST',
    headers:{...H,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)
  });
  return r.ok;
}

async function runSync(){
  const btn=document.getElementById('syncBtn');
  const box=document.getElementById('syncResult');
  btn.disabled=true;btn.textContent='同期中...';
  box.style.display='block';
  box.style.background='#f0f4ff';box.style.border='1px solid #c7d2fe';
  box.innerHTML='<strong>集計実行中...</strong> スプレッドシート・GA4のデータをSupabaseに同期しています。';

  const labels={daily_summary:'日次サマリー',orders:'注文データ',ga4:'GA4',inventory:'在庫',sns:'SNS'};
  let results={};
  let hasError=false;

  // 1. GAS Web App → EC/GA4/在庫 をSupabaseに同期
  try{
    const r=await fetch(GAS_SYNC_URL,{redirect:'follow',signal:AbortSignal.timeout(120000)});
    const ct=r.headers.get('content-type')||'';
    if(!r.ok||!ct.includes('json')){
      const txt=await r.text();
      const preview=txt.substring(0,200);
      throw new Error('HTTP '+r.status+' ('+ct.split(';')[0]+') '+preview);
    }
    const gasData=await r.json();
    Object.assign(results,gasData);
  }catch(e){
    results.daily_summary={ok:false,error:'GAS同期失敗: '+e.message};
    results.orders={ok:false,error:'GAS同期失敗: '+e.message};
    results.ga4={ok:false,error:'GAS同期失敗: '+e.message};
    results.inventory={ok:false,error:'GAS同期失敗: '+e.message};
    hasError=true;
  }

  // 2. SNS収集APIサーバー（Chrome起動時に自動起動）→ 収集 → Supabaseに直接書き込み
  box.innerHTML='<strong>集計実行中...</strong> SNSデータを収集しています。';
  try{
    const st=await fetch(SNS_API_URL+'/status',{cache:'no-store',signal:AbortSignal.timeout(3000)}).then(r=>r.json()).catch(()=>null);
    if(st&&st.cdp&&st.cdp.available){
      const openTabs=Object.entries(st.cdp.tabs).filter(([,v])=>v).map(([k])=>k);
      if(openTabs.length>0){
        const cr=await fetch(SNS_API_URL+'/collect',{cache:'no-store',signal:AbortSignal.timeout(360000)});
        const cd=await cr.json();
        if(cd.success&&cd.data){
          let cnt=0;
          for(const[p,d]of Object.entries(cd.data)){
            if(d&&await upsertSnsToSupabase(p,d))cnt++;
          }
          results.sns={ok:true,count:cnt};
          // kpi_sync_statusのsns行を更新
          try{await fetch(`${SB}/rest/v1/kpi_sync_status?sync_type=eq.sns`,{method:'PATCH',headers:{...H,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({last_sync:new Date().toISOString(),record_count:cnt,status:'ok',error_msg:null})})}catch(e){}
          const closed=Object.entries(st.cdp.tabs).filter(([,v])=>!v).map(([k])=>k);
          if(closed.length>0)results.sns.partial_skip='タブ未検出: '+closed.join(', ');
        }else{
          results.sns={ok:false,error:cd.error||'収集失敗'};
        }
      }else{
        results.sns={ok:false,skipped:true,reason:'SNSタブが開いていません（LINE/Instagram/TikTok）'};
      }
    }else if(st){
      results.sns={ok:false,skipped:true,reason:'Chrome CDPに接続できません（--remote-debugging-port=9222で起動してください）'};
    }else{
      results.sns={ok:false,skipped:true,reason:'SNS収集サーバー未起動（Chrome起動.batから起動してください）'};
    }
  }catch(e){
    results.sns={ok:false,skipped:true,reason:'SNS収集エラー: '+e.message};
  }

  // 3. 結果表示
  let html='<strong>同期完了</strong><br>';
  let hasSkip=false;
  for(const[k,v]of Object.entries(results)){
    const label=labels[k]||k;
    if(v.ok){
      html+=`<span style="color:#16a34a">\u2713</span> ${label}: ${v.count||0}件同期`;
      if(v.partial_skip)html+=` <span style="color:#d97706">（${v.partial_skip}）</span>`;
      html+='<br>';
    }else if(v.skipped){
      hasSkip=true;
      html+=`<span style="color:#d97706">\u25b3</span> ${label}: スキップ — ${v.reason}<br>`;
    }else{
      hasError=true;
      html+=`<span style="color:#dc2626">\u2717</span> ${label}: エラー — ${v.error||'不明'}<br>`;
    }
  }
  box.style.background=hasError?'#fef2f2':hasSkip?'#fffbeb':'#f0fdf4';
  box.style.border=hasError?'1px solid #fca5a5':hasSkip?'1px solid #fcd34d':'1px solid #86efac';
  box.innerHTML=html;

  // 4. Supabaseからデータ再読み込み
  try{ await init(); }catch(e){}
  btn.disabled=false;btn.textContent='\u21bb 集計更新';
}
