    });
  }

  // 4. エンゲージメント率推移
  const engRates=th.map(x=>{
    const v=(x.account_metrics||{}).views_30d||0;
    const i=(x.account_metrics||{}).interactions_30d||0;
    return v>0?(i/v*100):0;
  });
  if(engRates.some(r=>r>0)){
    snsCreateChart('sns-threads-eng-rate',{
      type:'line',
      data:{labels:dates,datasets:[{label:'エンゲージメント率(%)',data:engRates.map(r=>parseFloat(r.toFixed(2))),borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,0.08)',fill:true,tension:0.3,pointRadius:3}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return v+'%'}}}}}
    });
  }

  // 5. 閲覧ソース（最新・doughnut）
  const srcLabels=[],srcData=[],srcColors=['#4f46e5','#06b6d4','#f59e0b','#10b981','#94a3b8'];
  const srcMap={search:'検索',profile:'プロフィール',recommend:'おすすめ',following:'フォロー中',other:'その他'};
  Object.entries(vs).forEach(([k,v],i)=>{if(v>0){srcLabels.push(srcMap[k]||k);srcData.push(v);}});
  if(srcData.length>0){
    snsCreateChart('sns-threads-sources',{
      type:'doughnut',
      data:{labels:srcLabels,datasets:[{data:srcData,backgroundColor:srcColors.slice(0,srcData.length),borderWidth:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:function(c){return c.label+': '+c.parsed+'%'}}}}}
    });
  }

  // 6. 閲覧ソース推移（積み上げ棒）
  const srcKeys=['search','profile','recommend','following','other'];
  const srcTrendData={};
  srcKeys.forEach(k=>{srcTrendData[k]=[]});
  th.forEach(d=>{
    const s=d.view_sources||{};
    srcKeys.forEach(k=>{srcTrendData[k].push(s[k]||0)});
  });
  const activeSrcKeys=srcKeys.filter(k=>srcTrendData[k].some(v=>v>0));
  if(activeSrcKeys.length>0){
    const srcTrendColors={search:'#4f46e5',profile:'#06b6d4',recommend:'#f59e0b',following:'#10b981',other:'#94a3b8'};
    snsCreateChart('sns-threads-sources-trend',{
      type:'bar',
      data:{labels:dates,datasets:activeSrcKeys.map(k=>({label:srcMap[k]||k,data:srcTrendData[k],backgroundColor:srcTrendColors[k],borderRadius:1}))},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}}},scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:function(v){return v+'%'}}}}}
    });
  }

  // 7. 投稿パフォーマンステーブル（詳細版）
  const postsEl=document.getElementById('sns-threads-posts');
  if(postsEl){
    const allPosts=[];
    th.forEach(d=>{if(d.posts)d.posts.forEach(p=>{if(!allPosts.find(x=>x.post_id===p.post_id))allPosts.push(p)})});
    if(allPosts.length>0){
      allPosts.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      const hasDetail=allPosts.some(p=>p.interactions_detail||p.view_sources);
      let header,rowFn;
      if(hasDetail){
        header='<tr><th>日付</th><th>内容</th><th>閲覧</th><th>♥</th><th>返信</th><th>引用</th><th>再投稿</th><th>フォロー</th></tr>';
        rowFn=p=>{const id=p.interactions_detail||{};return `<tr><td style="white-space:nowrap">${p.date||''}</td><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(p.content||'').substring(0,35)}</td><td style="text-align:right;font-weight:bold">${(p.views||0).toLocaleString()}</td><td style="text-align:right">${id.likes||p.likes||0}</td><td style="text-align:right">${id.replies||0}</td><td style="text-align:right">${id.quotes||0}</td><td style="text-align:right">${id.reposts||0}</td><td style="text-align:right">${p.follows_from_post||0}</td></tr>`;};
      } else {
        header='<tr><th>日付</th><th>内容</th><th>閲覧</th><th>♥</th></tr>';
        rowFn=p=>`<tr><td style="white-space:nowrap">${p.date||''}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(p.content||'').substring(0,40)}</td><td style="text-align:right;font-weight:bold">${(p.views||0).toLocaleString()}</td><td style="text-align:right">${p.likes||0}</td></tr>`;
      }
      postsEl.innerHTML=`<table style="width:100%;font-size:13px"><thead>${header}</thead><tbody>${allPosts.map(rowFn).join('')}</tbody></table>`;
    } else {
      postsEl.innerHTML='<p style="color:#999;font-size:13px">投稿データなし（次回収集時に取得）</p>';
    }
  }

  // 8. 投稿別閲覧数比較（横棒）
  const allPostsForChart=[];
  th.forEach(d=>{if(d.posts)d.posts.forEach(p=>{if(!allPostsForChart.find(x=>x.post_id===p.post_id))allPostsForChart.push(p)})});
  if(allPostsForChart.length>0){
    allPostsForChart.sort((a,b)=>(a.views||0)-(b.views||0));
    const postLabels=allPostsForChart.map(p=>(p.content||'').substring(0,20)||(p.date||''));
    const postViews=allPostsForChart.map(p=>p.views||0);
    snsCreateChart('sns-threads-post-views',{
      type:'bar',
      data:{labels:postLabels,datasets:[{label:'閲覧数',data:postViews,backgroundColor:'#6366f1',borderRadius:4}]},
      options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}
    });
  }

  // 9. フォロワー成長率
  if(followers.length>=2){
    const growthRates=followers.map((f,i)=>{
      if(i===0||followers[i-1]===0) return 0;
      return parseFloat(((f-followers[i-1])/followers[i-1]*100).toFixed(3));
    });
    snsCreateChart('sns-threads-growth-rate',{
      type:'line',
      data:{labels:dates,datasets:[{label:'成長率(%)',data:growthRates,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.08)',fill:true,tension:0.3,pointRadius:3}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return v+'%'}}}}}
    });
  }

  // 10. 性別 (doughnut)
  if(gender.female||gender.male||gender.other){
    snsCreateChart('sns-threads-gender',{
      type:'doughnut',
      data:{labels:['女性','男性','その他'],datasets:[{data:[gender.female||0,gender.male||0,gender.other||0],backgroundColor:['#ec4899','#3b82f6','#a3a3a3'],borderWidth:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:function(c){return c.label+': '+c.parsed+'%'}}}}}
    });
  }

  // 11. 年齢層 (horizontal bar)
  const ageLabels=Object.keys(age);
  const ageData=Object.values(age);
  if(ageLabels.length>0){
    snsCreateChart('sns-threads-age',{
      type:'bar',
      data:{labels:ageLabels,datasets:[{label:'割合(%)',data:ageData,backgroundColor:'#6366f1',borderRadius:4}]},
      options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100,ticks:{callback:function(v){return v+'%'}}}}}
    });
  }

  // 12. 地域 (horizontal bar)
  const locLabels=Object.keys(loc);
  const locData=Object.values(loc);
  if(locLabels.length>0){
    snsCreateChart('sns-threads-location',{
      type:'bar',
      data:{labels:locLabels,datasets:[{label:'割合(%)',data:locData,backgroundColor:'#10b981',borderRadius:4}]},
      options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{callback:function(v){return v+'%'}}}}}
    });
  }
}


// ===== 最新履歴タブ =====
function renderHistory(orders,syncStatus){
  const el=document.getElementById('tab-history');if(!el)return;
  const dayNames=['日','月','火','水','木','金','土'];
  const sorted=[...orders].sort((a,b)=>{
    const da=a.order_datetime||a.order_date||'';
    const db=b.order_datetime||b.order_date||'';
    return db.localeCompare(da);
  }).slice(0,50);

  // --- システム同期ステータスパネル ---
  const now=new Date();
  function fmtSyncTime(dt,limitMin){
    if(!dt)return'<span style="color:#bbb">未同期</span>';
    const d=new Date(dt);if(isNaN(d))return dt;
    const mm=d.getMonth()+1,dd=d.getDate(),dow=dayNames[d.getDay()];
    const hh=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0');
    const diffMin=Math.floor((now-d)/60000);
    let ago=diffMin<1?'たった今':diffMin<60?diffMin+'分前':diffMin<1440?Math.floor(diffMin/60)+'時間前':Math.floor(diffMin/1440)+'日前';
    return mm+'/'+dd+'('+dow+') '+hh+':'+mi+' <span style="font-size:11px;color:'+(diffMin<=(limitMin||60)?'#16a34a':'#999')+'">'+ago+'</span>';
  }
  // 信号はソースごとの想定間隔で判定する。以前は全ソース一律で1時間/24時間を見ていたため、
  // 30日周期のSNSは常に赤、逆に6時間周期のGA4が丸1日死んでいても黄色のままだった。
  // しきい値は kpi_freshness.stale_after_minutes（同期管理タブで設定する想定間隔）を正とする。
  function dotColor(dt,limitMin){
    if(!dt)return'#ccc';
    const d=new Date(dt);if(isNaN(d))return'#ccc';
    const m=Math.floor((now-d)/60000);
    const lim=limitMin||60;
    return m<=lim?'#22c55e':m<=lim*2?'#f59e0b':'#ef4444';
  }
  function fmtLimit(min){
    if(!min)return'';
    return min<1440?'想定'+Math.round(min/60)+'時間毎':'想定'+Math.round(min/1440)+'日毎';
  }
  // kpi_sync_statusからsync_typeごとのlast_syncを取得
  const syMap={};
  (syncStatus||[]).forEach(s=>{syMap[s.sync_type]={last_sync:s.last_sync,status:s.status,count:s.record_count,error:s.error_msg}});
  // 表示行 → kpi_freshness のソース名。Shopify系とAmazon系は取込ジョブとしては
  // ec_orders 1本（Sheetsを一括で読む）なので同じソースを参照する。
  const frMapSync={};(FR||[]).forEach(x=>frMapSync[x.source]=x);
  // 表示する同期項目
  const syncItems=[
    {key:'_dashboard',label:'\u{1F4CA} ダッシュボード読込',color:'#667eea',time:now.toISOString(),limit:60},
    {key:'shopify',label:'\u{1F6D2} Shopify/社割/卸売 同期',color:'#96bf48',time:syMap.shopify?.last_sync,src:'ec_orders'},
    {key:'amazon_qoo10',label:'\u{1F4E6} Amazon/Qoo10/楽天 同期',color:'#ff9900',time:syMap.amazon_qoo10?.last_sync,src:'ec_orders'},
    {key:'ga4',label:'\u{1F4C8} GA4 同期',color:'#4285f4',time:syMap.ga4?.last_sync,src:'ga4'},
    {key:'inventory',label:'\u{1F4DD} 在庫 同期',color:'#10b981',time:syMap.inventory?.last_sync,src:'inventory'},
    {key:'sns',label:'\u{1F4F1} SNS 同期',color:'#e1306c',time:syMap.sns?.last_sync,src:'sns'},
  ];
  const syncRows=syncItems.map(it=>{
    const st=syMap[it.key];
    const fr=it.src?frMapSync[it.src]:null;
    const lim=it.limit||(fr&&fr.stale_after_minutes)||60;
    // 直近の実行が失敗していると last_success は古いまま止まるだけで、
    // 「何時間前」の表示からは落ちていることが分からない。両方のテーブルを見る。
    const err=(st&&st.status==='error'&&st.error)||((fr&&fr.last_status==='error')?'直近の同期が失敗しています':'');
    const errMsg=err?'<div style="font-size:11px;color:#ef4444;margin-top:2px">\u26A0 '+err+'</div>':'';
    const countStr=st&&st.count?'<span style="font-size:11px;color:#999;margin-left:6px">'+st.count+'件</span>':'';
    const limStr=it.limit?'':fmtLimit(lim);
    return'<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:'+(err?'#ef4444':dotColor(it.time,lim))+';display:inline-block;margin-top:5px;flex-shrink:0"></span>'+
      '<div style="min-width:180px;font-size:13px;font-weight:500;border-left:3px solid '+it.color+';padding-left:8px">'+it.label+countStr+'</div>'+
      '<div style="font-size:13px;color:#444">'+fmtSyncTime(it.time,lim)+
        (limStr?'<span style="font-size:11px;color:#bbb;margin-left:8px">'+limStr+'</span>':'')+errMsg+'</div>'+
    '</div>';
  }).join('');
  const syncPanel='<div class="card" style="margin-bottom:12px">'+
    '<h3 style="font-size:14px;margin-bottom:8px">\u{1F504} システム同期ステータス</h3>'+
    syncRows+
    '<p style="font-size:11px;color:#bbb;margin:8px 0 0">\u{1F7E2} 想定間隔内\u3000\u{1F7E1} 遅延\u3000\u{1F534} 停止の疑い／直近が失敗\u3000\u{26AA} 未同期</p></div>';

  const chIcon={shopify:'\u{1F6D2}',amazon:'\u{1F4E6}',qoo10:'\u{1F3EA}',rakuten:'\u{1F3EF}',employee:'\u{1F464}',wholesale:'\u{1F3E5}'};

  let rows=sorted.map(o=>{
    const dt=o.order_datetime||o.order_date||'';
    let dateDisp='';
    if(dt){
      const d=new Date(dt.replace(/-/g,'/'));
      if(!isNaN(d)){
        const mm=d.getMonth()+1,dd=d.getDate(),dow=dayNames[d.getDay()];
        const hh=d.getHours(),mi=String(d.getMinutes()).padStart(2,'0');
        if(dt.length>10){
          dateDisp=mm+'/'+dd+'('+dow+') '+hh+':'+mi;
        } else {
          dateDisp=mm+'/'+dd+'('+dow+')';
        }
      } else { dateDisp=dt; }
    }
    const ch=o.channel||'';
    const prod=normProd(o.product_name)||'\u4E0D\u660E';
    const qty=o.quantity||1;
    const total=o.total||0;
    return '<tr>'+
      '<td style="white-space:nowrap;font-size:13px">'+dateDisp+'</td>'+
      '<td>'+chBadge(ch)+'</td>'+
      '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+prod+'</td>'+
      '<td class="num">'+qty+'</td>'+
      '<td class="num" style="font-weight:600">'+yen(total)+'</td>'+
    '</tr>';
  }).join('');

  const chCounts={};
  sorted.forEach(o=>{const c=o.channel||'other';chCounts[c]=(chCounts[c]||0)+1});
  const chSummary=Object.entries(chCounts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
    chBadge(c)+' <b>'+n+'\u4EF6</b>'
  ).join('\u3000');

  el.innerHTML=syncPanel+'<div class="card" style="margin-bottom:16px">'+
    '<h3>\u{1F4CB} \u5168\u5A92\u4F53 \u6700\u65B0\u6CE8\u6587\u5C65\u6B74\uFF08\u65B0\u3057\u3044\u9806 50\u4EF6\uFF09</h3>'+
    '<p style="font-size:12px;color:#999;margin:4px 0 12px">\u5A92\u4F53\u5185\u8A33: '+chSummary+'</p>'+
    '<div style="overflow-x:auto">'+
    '<table style="width:100%;font-size:13px">'+
    '<thead><tr>'+
    '<th style="min-width:100px">\u65E5\u6642</th>'+
    '<th>\u5A92\u4F53</th>'+
    '<th>\u5546\u54C1\u540D</th>'+
    '<th class="num">\u6570\u91CF</th>'+
    '<th class="num">\u58F2\u4E0A</th>'+
    '</tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '</table></div></div>';
}

</script>
